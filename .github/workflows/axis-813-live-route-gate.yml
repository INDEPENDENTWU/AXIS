name: AXIS 8.13 Live Route

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact Stage 3 candidate
        run: node build-release.mjs
      - name: Verify Stage 3 manifest contract
        run: |
          node - <<'NODE'
          const m=require('./axis-build.json');
          const gates=['liveRoute813','liveRouteSingleOwner813','liveRouteReadOnly813','liveRoutePureRuntime813','liveRouteFallback813','liveRouteNoRecordingOwner813','liveRouteCanonicalSingleRuntime813'];
          for(const g of gates)if(m.gates?.[g]!==true)throw new Error(`missing ${g}`);
          const compatible=['8.12','8.12.1','8.12.2','8.12.3','8.12.4','8.12.5','8.13','8.13.1'];
          if(!compatible.includes(m.version)||m.baseVersion!==m.version||m.architecture!=='canonical-single-runtime'||m.requests?.initialJavascript!==1||m.requests?.dynamicJavascript!==0)throw new Error('Stage 3 topology drift');
          if(m.axis813?.stage3?.recordingOwner!==false||m.axis813?.stage3?.storageOwner!==false)throw new Error('Stage 3 ownership drift');
          NODE
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-813-route-chromium.log 2>&1 &
          sleep 1
      - name: Continue + Live Route regression
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: chromium
        run: node scripts/axis-813-live-route-ci-diagnostic.mjs
      - name: Repository contract
        run: node scripts/axis-repository-contract.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-813-route-chromium.log || true

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact Stage 3 candidate
        run: node build-release.mjs
      - name: Prepare WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-813-route-webkit.log 2>&1 &
          sleep 1
      - name: iPhone-like Continue + Live Route regression
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: webkit
        run: node scripts/axis-813-live-route-ci-diagnostic.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-813-route-webkit.log || true
