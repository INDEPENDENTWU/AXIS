name: AXIS EdgeOne Production Mirror

on:
  push:
    branches:
      - edgeone/8.12.3-production-mirror

permissions:
  contents: write

jobs:
  deploy-edgeone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      EDGEONE_PROJECT_NAME: ${{ secrets.EDGEONE_PROJECT_NAME }}
      VERCEL_GOLDEN_URL: https://axis-five-puce.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0

      - name: Require EdgeOne credential
        id: credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EDGEONE_API_TOKEN:-}" ]; then
            echo "::error::Repository secret EDGEONE_API_TOKEN is required for the isolated EdgeOne mirror deployment."
            exit 2
          fi
          if [ -z "${EDGEONE_PROJECT_NAME:-}" ]; then
            echo "EDGEONE_PROJECT_NAME=axisfitness" >> "$GITHUB_ENV"
          fi

      - name: Build exact AXIS candidate
        id: build
        run: node build-release.mjs

      - name: Verify canonical AXIS release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const m=require('./axis-build.json');
          if(m.version!=='8.12.3')throw new Error(`version drift: ${m.version}`);
          if(m.architecture!=='canonical-single-runtime')throw new Error(`architecture drift: ${m.architecture}`);
          if(m.requests?.initialJavascript!==1||m.requests?.dynamicJavascript!==0)throw new Error('runtime request topology drift');
          NODE

      - name: Verify Vercel visual/runtime parity before EdgeOne deploy
        id: parity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$VERCEL_GOLDEN_URL/axis-build.json" -o /tmp/vercel-axis-build.json
          node - <<'NODE'
          const local=require('./axis-build.json');
          const remote=require('/tmp/vercel-axis-build.json');
          const checks=[
            ['version',local.version,remote.version],
            ['architecture',local.architecture,remote.architecture],
            ['core',local.assets?.core,remote.assets?.core],
            ['css',local.assets?.css,remote.assets?.css],
            ['runtimeHash',local.canonical?.runtimeHash,remote.canonical?.runtimeHash],
            ['initialJavascript',local.requests?.initialJavascript,remote.requests?.initialJavascript],
            ['dynamicJavascript',local.requests?.dynamicJavascript,remote.requests?.dynamicJavascript]
          ];
          for(const [k,a,b] of checks)if(a!==b)throw new Error(`Vercel parity mismatch ${k}: ${a} != ${b}`);
          console.log('[AXIS EdgeOne parity] canonical product artifact matches Vercel Production');
          NODE

      - name: Install EdgeOne CLI
        id: cli
        run: npm install -g edgeone

      - name: Deploy isolated EdgeOne production mirror
        id: deploy
        shell: bash
        run: |
          set -u
          echo "Deploying AXIS 8.12.3 to EdgeOne project: $EDGEONE_PROJECT_NAME"
          set +e
          edgeone pages deploy -n "$EDGEONE_PROJECT_NAME" -e production -t "$EDGEONE_API_TOKEN" 2>&1 | tee /tmp/axis-edgeone-deploy.log
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"

      - name: Preserve deployment output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axis-edgeone-deploy-output
          path: /tmp/axis-edgeone-deploy.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Record isolated EdgeOne deployment status
        if: always()
        env:
          AXIS_JOB_STATUS: ${{ job.status }}
          AXIS_CREDENTIAL_OUTCOME: ${{ steps.credential.outcome }}
          AXIS_BUILD_OUTCOME: ${{ steps.build.outcome }}
          AXIS_RELEASE_OUTCOME: ${{ steps.release.outcome }}
          AXIS_PARITY_OUTCOME: ${{ steps.parity.outcome }}
          AXIS_CLI_OUTCOME: ${{ steps.cli.outcome }}
          AXIS_DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        shell: bash
        run: |
          set -u
          URL=""
          if [ -f /tmp/axis-edgeone-deploy.log ]; then
            URL="$(grep -Eo 'https://[^[:space:]]+' /tmp/axis-edgeone-deploy.log | tail -1 | sed 's/[),;]$//' || true)"
          fi
          node - <<'NODE'
          const fs=require('fs');
          const steps={
            credential:process.env.AXIS_CREDENTIAL_OUTCOME||'unknown',
            build:process.env.AXIS_BUILD_OUTCOME||'unknown',
            release:process.env.AXIS_RELEASE_OUTCOME||'unknown',
            parity:process.env.AXIS_PARITY_OUTCOME||'unknown',
            cli:process.env.AXIS_CLI_OUTCOME||'unknown',
            deploy:process.env.AXIS_DEPLOY_OUTCOME||'unknown'
          };
          let deployDiagnostic='';
          if(fs.existsSync('/tmp/axis-edgeone-deploy.log')){
            let raw=fs.readFileSync('/tmp/axis-edgeone-deploy.log','utf8');
            const token=process.env.EDGEONE_API_TOKEN||'';
            if(token)raw=raw.split(token).join('[REDACTED]');
            raw=raw.replace(/(?:token|secret|api[_-]?key)\s*[:=]\s*[^\s]+/ig,'$1=[REDACTED]');
            deployDiagnostic=raw.split(/\r?\n/).filter(Boolean).slice(-16).join('\n').slice(0,4000);
          }
          const body={
            status:process.env.AXIS_JOB_STATUS||'unknown',
            credentialConfigured:!!process.env.EDGEONE_API_TOKEN,
            project:process.env.EDGEONE_PROJECT_NAME||'axisfitness',
            deploymentUrl:'',
            steps,
            deployDiagnostic,
            sourceBranch:'edgeone/8.12.3-production-mirror',
            sourceSha:process.env.GITHUB_SHA||'',
            goldenVercel:'https://axis-five-puce.vercel.app',
            updatedAt:new Date().toISOString()
          };
          fs.writeFileSync('edgeone-deploy-status.json',JSON.stringify(body,null,2)+'\n');
          NODE
          if [ -n "$URL" ]; then
            node -e "const fs=require('fs'),p='edgeone-deploy-status.json',x=JSON.parse(fs.readFileSync(p));x.deploymentUrl=process.argv[1];fs.writeFileSync(p,JSON.stringify(x,null,2)+'\\n')" "$URL"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edgeone-deploy-status.json
          git commit -m "edgeone: record isolated mirror deployment status" || exit 0
          git push origin HEAD:edgeone/8.12.3-production-mirror
