name: AXIS Current Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact current AXIS candidate
        run: node build-release.mjs
      - name: Verify unified 8.14 through 8.18 semantic contract
        run: node scripts/axis-current-release-contract.mjs
      - name: Verify repository governance contract
        run: node scripts/axis-repository-contract.mjs
      - name: Verify exhaustive Object capability matrix
        run: node scripts/axis-821-object-capability-matrix-contract.mjs
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-current-chromium.log 2>&1 &
          sleep 1
      - name: Evolution foundation
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-8131-evolution-smoke.mjs
      - name: Evolution Objects
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-814-evolution-object-smoke.mjs
      - name: Media Evidence
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-815-media-evidence-smoke.mjs
      - name: Regression seal
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-8151-regression-seal-smoke.mjs
      - name: Stable Evidence swap
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-8151-evidence-swap-smoke.mjs
      - name: Watermark controls
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-watermark-smoke.mjs
      - name: Capture + Comparative Evidence
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-816-capture-evidence-smoke.mjs
      - name: Interaction Convergence
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-817-interaction-smoke.mjs
      - name: Source-first media
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-8171-source-first-media-smoke.mjs
      - name: 8.18 Object + Route + Capture + Focus
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-818-object-focus-smoke.mjs
      - name: 8.20 Executable Object
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-820-executable-object-smoke.mjs
      - name: 8.20.1 Object reliability
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-8201-object-reliability-smoke.mjs
      - name: 8.21 Flow runtime boundary
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-821-flow-runtime-smoke.mjs
      - name: 8.21 Executable Object system
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-821-executable-object-system-smoke.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-current-chromium.log || true

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact current AXIS candidate
        run: node build-release.mjs
      - name: Verify unified 8.14 through 8.18 semantic contract
        run: node scripts/axis-current-release-contract.mjs
      - name: Verify exhaustive Object capability matrix
        run: node scripts/axis-821-object-capability-matrix-contract.mjs
      - name: Prepare iPhone WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-current-webkit.log 2>&1 &
          sleep 1
      - name: iPhone Evolution foundation
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-8131-evolution-smoke.mjs
      - name: iPhone Evolution Objects
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-814-evolution-object-smoke.mjs
      - name: iPhone Media Evidence
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-815-media-evidence-smoke.mjs
      - name: iPhone regression seal
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-8151-regression-seal-smoke.mjs
      - name: iPhone stable Evidence swap
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-8151-evidence-swap-smoke.mjs
      - name: iPhone watermark controls
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-watermark-smoke.mjs
      - name: iPhone Capture + Comparative Evidence
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-816-capture-evidence-smoke.mjs
      - name: iPhone Interaction Convergence
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-817-interaction-smoke.mjs
      - name: iPhone source-first media
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-8171-source-first-media-smoke.mjs
      - name: iPhone 8.18 Object + Route + Capture + Focus
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-818-object-focus-smoke.mjs
      - name: iPhone 8.20 Executable Object
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-820-executable-object-smoke.mjs
      - name: iPhone 8.20.1 Object reliability
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-8201-object-reliability-smoke.mjs
      - name: iPhone 8.21 Flow runtime boundary
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-821-flow-runtime-smoke.mjs
      - name: iPhone 8.21 Executable Object system
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-821-executable-object-system-smoke.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-current-webkit.log || true
