name: AXIS 8.30 Object Identity Integrity Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Source inventory and identity invariant
        run: node scripts/axis-830-object-identity-audit.mjs --enforce
      - name: Build exact product candidate
        run: node build-release.mjs
      - name: Postbuild canonical identity
        run: node postbuild-830-object-identity-contract.mjs
      - name: Production governance and version
        run: |
          node scripts/axis-production-governance-contract.mjs
          node scripts/axis-repository-contract.mjs

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact product candidate
        run: node build-release.mjs
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-830-chromium.log 2>&1 &
          sleep 1
      - name: Native Object Identity + confirmed Encounter flow
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: chromium
        run: node scripts/axis-830-object-identity-smoke.mjs
      - name: Server log on failure
        if: failure()
        run: cat /tmp/axis-830-chromium.log || true

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact product candidate
        run: node build-release.mjs
      - name: Prepare iPhone WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-830-webkit.log 2>&1 &
          sleep 1
      - name: iPhone-like WebKit Object identity + confirmed Encounter flow
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: webkit
        run: node scripts/axis-830-object-identity-smoke.mjs
      - name: Server log on failure
        if: failure()
        run: cat /tmp/axis-830-webkit.log || true
