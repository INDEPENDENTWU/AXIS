name: AXIS 8.21 source-owner migration once

on:
  push:
    branches:
      - refactor/821-active-projection-source-owner

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/821-active-projection-source-owner
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
      - name: Move Active projection invalidation into explicit source owners
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const fail=m=>{throw new Error(m)};
          const once=(src,from,to,label)=>{
            const hits=src.split(from).length-1;
            if(hits!==1)fail(`${label}: expected exactly one anchor, found ${hits}`);
            return src.replace(from,to);
          };
          let v82=fs.readFileSync('v82-runtime.js','utf8');
          v82=once(
            v82,
            'writeMeta(m);renderActiveRail();decorateTimeline();\n  }\n  function pauseActivity(id)',
            "writeMeta(m);renderActiveRail();decorateTimeline();try{window.dispatchEvent(new CustomEvent('axis:active-truth-changed',{detail:{id:e.id,status:'active'}}))}catch{};\n  }\n  function pauseActivity(id)",
            'v82 startActivity Active projection invalidation'
          );
          fs.writeFileSync('v82-runtime.js',v82);

          let v87=fs.readFileSync('v87-runtime.js','utf8');
          const pageShow="window.addEventListener('pageshow',()=>{injectAudio();renderNow(true);renderTimeline()});";
          v87=once(
            v87,
            pageShow,
            "window.addEventListener('axis:active-truth-changed',()=>{renderNow(true);renderTimeline()});"+pageShow,
            'v87 Active projection listener'
          );
          fs.writeFileSync('v87-runtime.js',v87);

          let seal=fs.readFileSync('postbuild-821-executable-object-presentation-seal.mjs','utf8');
          const replaceCall=(src,start,end,newBlock,label)=>{
            const a=src.indexOf(start);if(a<0)fail(`${label}: start marker missing`);
            const b=src.indexOf(end,a);if(b<0)fail(`${label}: end marker missing`);
            if(src.indexOf(start,a+start.length)>=0)fail(`${label}: duplicated start marker`);
            return src.slice(0,a)+newBlock+src.slice(b+end.length);
          };
          seal=replaceCall(
            seal,
            "src=mutateModuleFunction(src,'v82-runtime.js','function startActivity(e,customEstimate)'",
            "},'v82 Active synchronous presentation invalidation');",
            `{
 const fn=moduleFunctionRange(src,'v82-runtime.js','function startActivity(e,customEstimate)','v82 source-owned Active synchronous presentation invalidation').text;
 const signal="window.dispatchEvent(new CustomEvent('axis:active-truth-changed',{detail:{id:e.id,status:'active'}}))";
 if(fn.split(signal).length-1!==1)fail('v82 source-owned Active presentation invalidation missing or duplicated');
}`,
            'postbuild v82 mutation retirement'
          );
          seal=replaceCall(
            seal,
            "src=mutateModuleFunction(src,'v87-runtime.js','function installEvents()'",
            "},'v87 synchronous Active projection listener');",
            `{
 const fn=moduleFunctionRange(src,'v87-runtime.js','function installEvents()','v87 source-owned Active projection listener').text;
 const listener="window.addEventListener('axis:active-truth-changed',()=>{renderNow(true);renderTimeline()})";
 if(fn.split(listener).length-1!==1)fail('v87 source-owned Active presentation listener missing or duplicated');
}`,
            'postbuild v87 mutation retirement'
          );
          seal=once(
            seal,
            "activeProjection:'same-task-invalidation',flowProjection:'same-task-current-encounter'",
            "activeProjection:'same-task-invalidation',activeProjectionOwner:'v82-runtime.js+v87-runtime.js',activeProjectionPostbuildMutation:false,flowProjection:'same-task-current-encounter'",
            '8.21 Active projection provenance'
          );
          fs.writeFileSync('postbuild-821-executable-object-presentation-seal.mjs',seal);
          NODE
      - name: Verify bounded diff and retire migration workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/axis-821-source-owner-migration-once.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' postbuild-821-executable-object-presentation-seal.mjs v82-runtime.js v87-runtime.js | sort)"
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add postbuild-821-executable-object-presentation-seal.mjs v82-runtime.js v87-runtime.js
          git commit -m 'refactor(8.21): move Active projection into source owners'
          git push origin HEAD:refactor/821-active-projection-source-owner
