name: AXIS Inherited Web Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: axis-inherited-web-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build current AXIS candidate
        run: node build-release.mjs
      - name: Verify release and inherited owners
        run: |
          node - <<'NODE'
          const m=require('./axis-build.json'),fs=require('fs'),core=fs.readFileSync('axis-core.js','utf8');
          if(!['8.13.1','8.14','8.15','8.15.1','8.16'].includes(m.version)||m.baseVersion!==m.version)throw new Error(`release mismatch ${m.version}/${m.baseVersion}`);
          for(const gate of ['trainingIntervalUnion8124','projectGapLatestActivity8124','sessionActivitySeal8124','quickRecordDirectRecent8124','liveRouteReadOnly813','settingsVerticalNative8124','trendsTimeField813','trendsSessionFingerprint813','trendsHorizontalScrub813','trendsEdgeSafe813','trendsReducedMotion813','trendsReadOnly813','evolutionFoundation8131','trendsStateLifecycle8131','trendsFactualCopy8131','trendsSameDaySessions8131','trendsMetaActivity8131','trendsNavigationRefresh8131','trendsTruthfulDuration8131'])if(m.gates?.[gate]!==true)throw new Error(`release gate missing ${gate}`);
          for(const needle of ['__AXIS_8124_WORKOUT_OWNER__','__AXIS_8124_CATALOG_POLISH__','__AXIS_8124_CUSTOM_SAFE__','__AXIS_8125_SMART_CREATE_POLISH__','__AXIS_8131_EVOLUTION_FIELD__','__AXIS_EVOLUTION__','v8131-evolution-field','axis:state-changed'])if(!core.includes(needle))throw new Error(`compiled owner missing ${needle}`);
          NODE
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-inherited-chromium.log 2>&1 &
          sleep 1
      - name: Inherited Evolution and sealed-session lifecycle
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-8131-evolution-smoke.mjs
      - name: Inherited training timing and completion
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-8124-flow-smoke.mjs
      - name: Inherited Live Route
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-813-live-route-smoke.mjs
      - name: Inherited Settings geometry
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-813-settings-convergence-smoke.mjs
      - name: Inherited catalog and smart-create
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: |
          node scripts/axis-8124-catalog-polish-smoke.mjs
          node scripts/axis-8125-smart-create-polish-smoke.mjs
      - name: Repository contract
        run: node scripts/axis-repository-contract.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-inherited-chromium.log || true

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build current AXIS candidate
        run: node build-release.mjs
      - name: Prepare iPhone WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-inherited-webkit.log 2>&1 &
          sleep 1
      - name: iPhone inherited Evolution and sealed-session lifecycle
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-8131-evolution-smoke.mjs
      - name: iPhone inherited training timing and completion
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-8124-flow-smoke.mjs
      - name: iPhone inherited Live Route and Settings
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: |
          node scripts/axis-813-live-route-smoke.mjs
          node scripts/axis-813-settings-convergence-smoke.mjs
      - name: iPhone inherited catalog and smart-create
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: |
          node scripts/axis-8124-catalog-polish-smoke.mjs
          node scripts/axis-8125-smart-create-polish-smoke.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-inherited-webkit.log || true
