name: AXIS 8.21 Recording Geometry Diagnostic

on:
  push:
    branches: [hotfix/821-recording-geometry-stability]

jobs:
  production-geometry-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Prepare exact branch diagnostic contract
        run: |
          node build-release.mjs
          node scripts/prepare-release-test-contract.mjs
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Stress fixed Vercel Production recording geometry
        env:
          AXIS_URL: https://axis-five-puce.vercel.app
          AXIS_ENGINE: chromium
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "===== Production geometry attempt ${attempt}/12 ====="
            node scripts/axis-completion-smoke.mjs
          done
