name: AXIS 8.21 Source Repair

on:
  push:
    branches:
      - fix/821-native-flow-recording-convergence

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/821-native-flow-recording-convergence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source repair
        run: node scripts/axis-821-source-repair.mjs
      - name: Validate repaired source
        run: |
          node --check v61.js
          git diff --check
      - name: Commit clean source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "AXIS 8.21 — source-own Quick media hook"
          git push origin HEAD:fix/821-native-flow-recording-convergence
