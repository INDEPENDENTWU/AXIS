name: AXIS 8.13 Runtime Core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Pure Runtime invariants
        run: node scripts/axis-813-runtime-core.mjs
      - name: Rebuild unchanged 8.12 Production artifact
        run: node build-release.mjs
      - name: Exact 8.12 build parity
        run: node scripts/axis-813-build-parity.mjs
      - name: Repository contract
        run: node scripts/axis-repository-contract.mjs
