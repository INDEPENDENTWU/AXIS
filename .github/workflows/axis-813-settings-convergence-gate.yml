name: AXIS 8.13 Settings Convergence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact settings candidate
        run: node build-release.mjs
      - name: Verify topology and convergence marker
        run: |
          node - <<'NODE'
          const fs=require('fs');const m=require('./axis-build.json');const core=fs.readFileSync('axis-core.js','utf8');
          if(!['8.12','8.12.1','8.12.2','8.12.3','8.12.4','8.12.5','8.13','8.13.1','8.14','8.15','8.15.1','8.16','8.17'].includes(m.version)||m.architecture!=='canonical-single-runtime'||m.requests?.initialJavascript!==1||m.requests?.dynamicJavascript!==0||m.assets?.chunks?.length!==0)throw new Error('release topology drift');
          for(const gate of ['learningSettingsPurpose812','learningSettingsMethod812','learningSettingsNovelty812','serviceSettingsConverged811','serviceSettingsUserInvokedNetwork811','serviceSettingsNoTrainingOwner811','liveRoute813','liveRouteReadOnly813'])if(m.gates?.[gate]!==true)throw new Error(`inherited gate missing: ${gate}`);
          if(!core.includes('__AXIS_813_SETTINGS__')||!core.includes('canonical-settings-inline'))throw new Error('settings convergence marker missing from canonical core');
          NODE
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-813-settings-chromium.log 2>&1 &
          sleep 1
      - name: Inline Settings ownership regression
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: chromium
        run: node scripts/axis-813-settings-convergence-smoke.mjs
      - name: Repository contract
        run: node scripts/axis-repository-contract.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-813-settings-chromium.log || true

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact settings candidate
        run: node build-release.mjs
      - name: Prepare WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-813-settings-webkit.log 2>&1 &
          sleep 1
      - name: iPhone-like inline Settings ownership regression
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: webkit
        run: node scripts/axis-813-settings-convergence-smoke.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-813-settings-webkit.log || true
