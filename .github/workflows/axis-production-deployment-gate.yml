name: AXIS Production Deployment Gate

on:
  deployment_status:

concurrency:
  group: axis-production-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  production-browser-gate:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: read
    env:
      AXIS_URL: https://axis-five-puce.vercel.app
      AXIS_EXPECTED_SHA: ${{ github.event.deployment.sha }}
    steps:
      - name: Checkout exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Resolve identity from the same release build
        shell: bash
        run: |
          set -euo pipefail
          node build-release.mjs
          node <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('axis-build.json','utf8'));
          for(const k of ['version','baseVersion','architecture'])if(x[k]===undefined||x[k]===null||x[k]==='')throw new Error(`axis-build missing ${k}`);
          console.log(`AXIS_EXPECTED_VERSION=${x.version}`);
          console.log(`AXIS_EXPECTED_BASE=${x.baseVersion}`);
          console.log(`AXIS_EXPECTED_ARCH=${x.architecture}`);
          NODE
      - name: Align browser assertions to built release identity
        run: node scripts/prepare-release-test-contract.mjs
      - name: Wait for fixed Production URL to serve exact source commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code=$(curl -LsS --connect-timeout 5 --max-time 15 -o /tmp/axis-build.json -w '%{http_code}' "$AXIS_URL/axis-build.json" || true)
            if [ "$code" = "200" ]; then
              if EXPECTED="$AXIS_EXPECTED_SHA" VERSION="$AXIS_EXPECTED_VERSION" BASE="$AXIS_EXPECTED_BASE" ARCH="$AXIS_EXPECTED_ARCH" node <<'NODE'
          const fs=require('fs');
          try{const x=JSON.parse(fs.readFileSync('/tmp/axis-build.json','utf8'));process.exit(x.sourceCommit===process.env.EXPECTED&&x.version===process.env.VERSION&&x.baseVersion===process.env.BASE&&x.architecture===process.env.ARCH?0:1)}catch{process.exit(1)}
          NODE
              then
                curl -LfsS --connect-timeout 5 --max-time 15 "$AXIS_URL/" -o /tmp/axis-production-index.html
                exit 0
              fi
            fi
            echo "Attempt $attempt · public Production not yet exact ($code) · waiting for $AXIS_EXPECTED_SHA / $AXIS_EXPECTED_VERSION"
            sleep 3
          done
          echo "::error title=AXIS Production mismatch::${AXIS_URL} did not anonymously serve exact built release ${AXIS_EXPECTED_VERSION} at ${AXIS_EXPECTED_SHA}."
          exit 1
      - name: Verify canonical Production manifest and immutable assets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/axis-build.json','utf8')),html=fs.readFileSync('/tmp/axis-production-index.html','utf8'),fail=m=>{throw new Error(m)};
          if(x.sourceCommit!==process.env.AXIS_EXPECTED_SHA)fail(`source commit mismatch ${x.sourceCommit}`);
          if(x.version!==process.env.AXIS_EXPECTED_VERSION||x.baseVersion!==process.env.AXIS_EXPECTED_BASE)fail(`release identity mismatch ${x.version}/${x.baseVersion}`);
          if(x.architecture!=='canonical-single-runtime'||x.architecture!==process.env.AXIS_EXPECTED_ARCH)fail(`unexpected architecture ${x.architecture}`);
          if(x.requests?.initialJavascript!==1||x.requests?.dynamicJavascript!==0)fail(`unexpected JS topology ${JSON.stringify(x.requests)}`);
          if(!Array.isArray(x.assets?.chunks)||x.assets.chunks.length!==0)fail('historical dynamic chunks survived');
          const required=[
            'canonicalSingleRuntime','noDynamicRuntimeChunks','noVersionFallback','historicalReleaseWriterRetired','sourceCommitStamped','singleActiveAdjustmentOwner','legacyV8710ActiveAdjustRetired','catalogCategorySingleOwner','capturePreferenceSingleOwner','canonicalReplacementPreservesDoubleDollar',
            'watermarkFourSwitchContract','precisePlaceResolver','noRawCoordinatePresentation','watermarkSingleLocateOwner','watermarkPreferenceSingleWriter','groupPlanUnitlessControls','groupPlanExpandedPresets','activeItemCountdown','activeItemCountdownTone','activeItemLongPressSuppressesTone','watermarkCenterBrand','watermarkBrandOpacitySingleTarget',
            'homeStateSingleOwner','homeStateAdaptiveRest','localVisualMemory','quickCustomEquipment','quickMediaAttachment','activeCardGeometryStable','countdownOnlyAutomaticSound','expandedExerciseLibrary','waistAnatomyRegion','durableReleaseLog','mediaStoreWebKitSafe',
            'learningAtlas811','learningAtlasUnique811','learningDialogueSixTurn811','learningConnectedSpeech811','learningSpelling811','learningSettingsConverged811','learningLegacyDiagnosticsPreserved811','learningJapanese132811','learningKorean132811','learningChinese132811','learningMultilingualSixTurn811','learningMultilingualNoLegacyExactOverlap811','trendsStateField811','trendsGoalAware811','trendsEvidenceOnly811','trendsLocalFirst811','trendsOneShotMotion811','serviceSettingsConverged811','serviceSettingsUserInvokedNetwork811','serviceSettingsNoTrainingOwner811'
          ];
          if(['8.12','8.12.1','8.12.2'].includes(process.env.AXIS_EXPECTED_VERSION))required.push('languageStudio812','languageCorpusExpanded812','nativeMultilingual812','dialogueTailDiversity812','dialogueDepthSelectable812','teachingLoop812','activeRecall812','transformPractice812','learningSettingsPurpose812','learningSettingsMethod812','learningSettingsNovelty812','legacy811Preserved812','learningNoAutoplay812','learningLocalFirst812','learningNoTrainingOwner812');
          for(const k of required)if(x.gates?.[k]!==true)fail(`missing Production gate ${k}`);
          if(x.featureKernel?.embedded!==true||x.completionKernel?.embedded!==true)fail('feature/completion are not embedded');
          if(x.canonical?.version!==process.env.AXIS_EXPECTED_VERSION)fail(`canonical version contract mismatch ${x.canonical?.version}`);
          if(x.canonical?.activeCountdown?.toneOwner!=='v8710-sound-ui.js'||x.canonical?.activeCountdown?.longPressSuppressesTone!==true)fail('countdown owner contract mismatch');
          const durationSound=['8.10.3','8.11','8.12','8.12.1','8.12.2'].includes(process.env.AXIS_EXPECTED_VERSION),expectedTrigger=durationSound?'active-item-countdown-zero + explicit-workout-duration-threshold':'active-item-countdown-zero-only';
          if(x.canonical?.sound?.automaticTrigger!==expectedTrigger||x.canonical?.sound?.setCue!==false||x.canonical?.sound?.manualFinishCue!==false||x.canonical?.sound?.restCue!==false||x.canonical?.sound?.sessionCue!==durationSound)fail(`automatic sound contract mismatch ${JSON.stringify(x.canonical?.sound)}`);
          if(x.canonical?.homeState?.owner!=='app.js'||x.canonical?.localVisualMemory?.networkRequired!==false)fail('home/local-memory contract mismatch');
          if(x.canonical?.quickRecord?.customItems!==true||x.canonical?.quickRecord?.mediaModes?.join(',')!=='photo,3,5')fail('Quick Record 8.8.2 contract mismatch');
          if(x.canonical?.activeCard?.outerGeometryStable!==true)fail('active card geometry contract mismatch');
          if(x.canonical?.watermarkBrand?.text!=='AXIS'||x.canonical?.watermarkBrand?.opacityOwner!=='v876WmOpacity')fail('brand owner contract mismatch');
          if(['8.11','8.12','8.12.1','8.12.2'].includes(process.env.AXIS_EXPECTED_VERSION)){
            if(x.axis811?.release!==true)fail('AXIS 8.11 inherited release descriptor missing');
            if(x.axis811?.learning?.totalEnglish!==5736||x.axis811?.learning?.totalUnits!==6132||x.axis811?.learning?.dialogueTurns!==6)fail('AXIS 8.11 inherited learning contract mismatch');
            for(const [lang,n] of Object.entries({en:5736,ja:132,ko:132,zh:132}))if(x.axis811?.learning?.availableByLanguage?.[lang]!==n)fail(`AXIS 8.11 ${lang} count mismatch`);
            if(x.axis811?.trends?.model!=='state-field-trajectory'||x.axis811?.trends?.fitnessScore!==false||x.axis811?.trends?.networkRequired!==false)fail('AXIS 8.11 State Field contract mismatch');
            if(x.axis811?.services?.localFirst!==true||x.axis811?.services?.automaticNetwork!==false||x.axis811?.services?.clientSecrets!==false)fail('AXIS 8.11 cloud/AI contract mismatch');
          }
          if(['8.12','8.12.1','8.12.2'].includes(process.env.AXIS_EXPECTED_VERSION)){
            if(x.axis812?.release!==true)fail('AXIS 8.12 release descriptor missing');
            if(x.axis812?.learning?.totalNew!==19584||x.axis812?.learning?.totalAvailable!==25716)fail('AXIS 8.12 corpus totals mismatch');
            for(const [lang,n] of Object.entries({en:10632,ja:5028,ko:5028,zh:5028}))if(x.axis812?.learning?.availableByLanguage?.[lang]!==n)fail(`AXIS 8.12 ${lang} count mismatch`);
            if(x.axis812?.learning?.dialogueTurns?.short!==4||x.axis812?.learning?.dialogueTurns?.full!==8||x.axis812?.learning?.dialogueTurns?.immersive!==12)fail('AXIS 8.12 dialogue depth mismatch');
            if(x.axis812?.learning?.teachingLoop?.join('|')!=='meaning|noticing|retrieval|response|shadow|transform|review')fail('AXIS 8.12 pedagogy mismatch');
            if(x.axis812?.learning?.networkRequired!==false||x.axis812?.learning?.autoplay!==false||x.axis812?.learning?.trainingOwner!==false)fail('AXIS 8.12 ownership mismatch');
          }
          if(!/^[a-f0-9]{12}$/.test(x.assets?.core||'')||!/^[a-f0-9]{12}$/.test(x.assets?.css||''))fail('invalid immutable asset hash');
          const scripts=[...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(m=>m[1]);
          if(scripts.length!==1||scripts[0]!==`/axis-core.js?v=${x.assets.core}`)fail(`Production HTML script mismatch ${scripts}`);
          if(!html.includes(`data-axis-runtime="canonical-${process.env.AXIS_EXPECTED_VERSION}"`))fail('canonical HTML marker missing');
          if(/AXIS_FEATURE_LOADER_START|AXIS_COMPLETION_LOADER_START|axis-enhance-(foundation|recording|interaction|product)\.js/.test(html))fail('retired dynamic loader survives in Production HTML');
          fs.writeFileSync('/tmp/axis-assets.tsv',`core\t/axis-core.js?v=${x.assets.core}\t20000\ncss\t/axis-style.css?v=${x.assets.css}\t10000\n`);
          console.log(`[AXIS Production] ${x.version} · ${x.sourceCommit.slice(0,10)} · inherited + Language Studio contracts verified`);
          NODE
          while IFS=$'\t' read -r name path min_bytes; do
            test -n "$name" || continue
            out="/tmp/axis-production-$name"
            curl -LfsS --connect-timeout 5 --max-time 20 "$AXIS_URL$path" -o "$out"
            bytes=$(wc -c <"$out")
            test "$bytes" -ge "$min_bytes" || { echo "$name asset too small: $bytes"; exit 1; }
            echo "Asset OK · $name · $bytes bytes"
          done </tmp/axis-assets.tsv
      - name: Prepare real Chromium harness
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Real Chromium inherited product gates against fixed Production URL
        run: |
          node scripts/run-smoke-guarded.mjs
          node scripts/axis-completion-smoke.mjs
          node scripts/axis-88-smoke.mjs
          AXIS_ENGINE=chromium node scripts/axis-catalog-smoke.mjs
          AXIS_ENGINE=chromium node scripts/axis-watermark-smoke.mjs
          AXIS_ENGINE=chromium node scripts/axis-881-smoke.mjs
          AXIS_ENGINE=chromium node scripts/axis-882-smoke.mjs
          node scripts/axis-product-matrix.mjs
      - name: Real Chromium inherited AXIS 8.11 experience against fixed Production URL
        env:
          AXIS_ENGINE: chromium
        run: node scripts/axis-811-browser-smoke.mjs
      - name: Real Chromium AXIS 8.12 Language Studio against fixed Production URL
        if: contains(fromJSON('["8.12","8.12.1","8.12.2"]'), env.AXIS_EXPECTED_VERSION)
        env:
          AXIS_ENGINE: chromium
        run: node scripts/axis-812-browser-smoke.mjs
      - name: Real Chromium AXIS 8.12.2 Settings against fixed Production URL
        if: env.AXIS_EXPECTED_VERSION == '8.12.2'
        env:
          AXIS_ENGINE: chromium
        run: node scripts/axis-8122-settings-smoke.mjs
