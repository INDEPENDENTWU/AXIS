name: AXIS Production Deployment Gate

on:
  deployment_status:

concurrency:
  group: axis-production-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  production-browser-gate:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 36
    permissions:
      contents: read
    env:
      AXIS_URL: https://axis-five-puce.vercel.app
      AXIS_EXPECTED_SHA: ${{ github.event.deployment.sha }}
    steps:
      - name: Checkout exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Build exact deployed release identity
        shell: bash
        run: |
          set -euo pipefail
          node build-release.mjs
          cp axis-build.json /tmp/axis-local-build.json
          node <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/axis-local-build.json','utf8'));
          for(const k of ['version','baseVersion','architecture','sourceCommit'])if(x[k]===undefined||x[k]===null||x[k]==='')throw new Error(`axis-build missing ${k}`);
          if(x.sourceCommit!==process.env.AXIS_EXPECTED_SHA)throw new Error(`local release sourceCommit ${x.sourceCommit} != deployed ${process.env.AXIS_EXPECTED_SHA}`);
          console.log(`AXIS_EXPECTED_VERSION=${x.version}`);
          console.log(`AXIS_EXPECTED_BASE=${x.baseVersion}`);
          console.log(`AXIS_EXPECTED_ARCH=${x.architecture}`);
          NODE
      - name: Align browser assertions to built release identity
        run: node scripts/prepare-release-test-contract.mjs
      - name: Wait for fixed Production URL to serve exact built release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code=$(curl -LsS --connect-timeout 5 --max-time 15 -o /tmp/axis-build.json -w '%{http_code}' "$AXIS_URL/axis-build.json" || true)
            if [ "$code" = "200" ]; then
              if EXPECTED="$AXIS_EXPECTED_SHA" VERSION="$AXIS_EXPECTED_VERSION" BASE="$AXIS_EXPECTED_BASE" ARCH="$AXIS_EXPECTED_ARCH" node <<'NODE'
          const fs=require('fs');
          try{
            const x=JSON.parse(fs.readFileSync('/tmp/axis-build.json','utf8'));
            process.exit(x.sourceCommit===process.env.EXPECTED&&x.version===process.env.VERSION&&x.baseVersion===process.env.BASE&&x.architecture===process.env.ARCH?0:1);
          }catch{process.exit(1)}
          NODE
              then
                curl -LfsS --connect-timeout 5 --max-time 15 "$AXIS_URL/" -o /tmp/axis-production-index.html
                exit 0
              fi
            fi
            echo "Attempt $attempt · public Production not yet exact ($code) · waiting for $AXIS_EXPECTED_SHA / $AXIS_EXPECTED_VERSION"
            sleep 3
          done
          echo "::error title=AXIS Production mismatch::${AXIS_URL} did not anonymously serve exact built release ${AXIS_EXPECTED_VERSION} at ${AXIS_EXPECTED_SHA}."
          exit 1
      - name: Verify exact Production manifest and immutable assets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const local=JSON.parse(fs.readFileSync('/tmp/axis-local-build.json','utf8'));
          const remote=JSON.parse(fs.readFileSync('/tmp/axis-build.json','utf8'));
          const html=fs.readFileSync('/tmp/axis-production-index.html','utf8');
          const normalize=x=>{const y=structuredClone(x);delete y.generatedAt;return y};
          try{assert.deepStrictEqual(normalize(remote),normalize(local))}catch(err){
            console.error('::error title=AXIS Production manifest drift::Fixed Production manifest differs from the exact local build for the deployed commit.');
            throw err;
          }
          if(remote.sourceCommit!==process.env.AXIS_EXPECTED_SHA)throw new Error(`source commit mismatch ${remote.sourceCommit}`);
          if(remote.architecture!=='canonical-single-runtime')throw new Error(`unexpected architecture ${remote.architecture}`);
          if(remote.requests?.initialJavascript!==1||remote.requests?.dynamicJavascript!==0)throw new Error(`unexpected JS topology ${JSON.stringify(remote.requests)}`);
          if(!Array.isArray(remote.assets?.chunks)||remote.assets.chunks.length!==0)throw new Error('historical dynamic chunks survived');
          if(!/^[a-f0-9]{12}$/.test(remote.assets?.core||'')||!/^[a-f0-9]{12}$/.test(remote.assets?.css||''))throw new Error('invalid immutable asset hash');
          const scripts=[...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(m=>m[1]);
          if(scripts.length!==1||scripts[0]!==`/axis-core.js?v=${remote.assets.core}`)throw new Error(`Production HTML script mismatch ${scripts}`);
          if(!html.includes(`data-axis-runtime="canonical-${remote.version}"`))throw new Error('canonical HTML marker missing');
          if(/AXIS_FEATURE_LOADER_START|AXIS_COMPLETION_LOADER_START|axis-enhance-(foundation|recording|interaction|product)\.js/.test(html))throw new Error('retired dynamic loader survives in Production HTML');
          fs.writeFileSync('/tmp/axis-assets.tsv',`core\t/axis-core.js?v=${remote.assets.core}\t20000\ncss\t/axis-style.css?v=${remote.assets.css}\t10000\n`);
          console.log(`[AXIS Production] exact manifest parity · ${remote.version} · ${remote.sourceCommit.slice(0,10)} · ${remote.assets.core}`);
          NODE
          while IFS=$'\t' read -r name path min_bytes; do
            test -n "$name" || continue
            out="/tmp/axis-production-$name"
            curl -LfsS --connect-timeout 5 --max-time 20 "$AXIS_URL$path" -o "$out"
            bytes=$(wc -c <"$out")
            test "$bytes" -ge "$min_bytes" || { echo "$name asset too small: $bytes"; exit 1; }
            echo "Asset OK · $name · $bytes bytes"
          done </tmp/axis-assets.tsv
      - name: Prepare real Chromium harness
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Real Chromium inherited product foundation against fixed Production URL
        env:
          AXIS_ENGINE: chromium
        run: |
          node scripts/run-smoke-guarded.mjs
          node scripts/axis-completion-smoke.mjs
          node scripts/axis-88-smoke.mjs
          node scripts/axis-catalog-smoke.mjs
          node scripts/axis-watermark-smoke.mjs
          node scripts/axis-881-smoke.mjs
          node scripts/axis-882-smoke.mjs
          node scripts/axis-product-matrix.mjs
          node scripts/axis-811-browser-smoke.mjs
          node scripts/axis-812-browser-smoke.mjs
          node scripts/axis-8122-settings-smoke.mjs
          node scripts/axis-8123-learning-simplify-smoke.mjs
      - name: Real Chromium current release flow against fixed Production URL
        env:
          AXIS_ENGINE: chromium
        run: |
          node scripts/axis-8124-flow-smoke.mjs
          node scripts/axis-8131-evolution-smoke.mjs
          node scripts/axis-814-evolution-object-smoke.mjs
          node scripts/axis-815-media-evidence-smoke.mjs
          node scripts/axis-8151-regression-seal-smoke.mjs
          node scripts/axis-8151-evidence-swap-smoke.mjs
          node scripts/axis-816-capture-evidence-smoke.mjs
          node scripts/axis-817-interaction-smoke.mjs
          node scripts/axis-8171-source-first-media-smoke.mjs
          node scripts/axis-818-object-focus-smoke.mjs
          node scripts/axis-819-object-recording-smoke.mjs
          node scripts/axis-820-executable-object-smoke.mjs
          node scripts/axis-8201-object-reliability-smoke.mjs
          node scripts/axis-821-flow-runtime-smoke.mjs
          node scripts/axis-821-recording-property-surface-smoke.mjs
          node scripts/axis-821-quick-photo-metric-centering-smoke.mjs
          node scripts/axis-821-executable-object-system-smoke.mjs
