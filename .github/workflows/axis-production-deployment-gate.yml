name: AXIS Production Deployment Gate

on:
  deployment_status:

concurrency:
  group: axis-production-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  production-browser-gate:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AXIS_DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
      AXIS_EXPECTED_SHA: ${{ github.event.deployment.sha }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout the exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'

      - name: Resolve exact Production endpoint
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >/tmp/axis-production-candidates.txt
          const deployment=new URL(process.env.AXIS_DEPLOYMENT_URL);
          const project=(process.env.GITHUB_REPOSITORY||'repo/axis').split('/').pop().toLowerCase();
          const out=[];
          const add=x=>{if(x&&!out.includes(x))out.push(x.replace(/\/$/,''))};
          add(process.env.AXIS_DEPLOYMENT_URL);
          const host=deployment.hostname;
          if(host.endsWith('.vercel.app')&&host.startsWith(project+'-')){
            const rest=host.slice(project.length+1);
            const cut=rest.indexOf('-');
            if(cut>0){
              const scopeHost=rest.slice(cut+1);
              add(`https://${project}-${scopeHost}`);
              add(`https://${project}-git-main-${scopeHost}`);
              add(`https://${project}-main-${scopeHost}`);
            }
          }
          add(`https://${project}.vercel.app`);
          console.log(out.join('\n'));
          NODE

          axis_curl(){
            local url="$1" out="$2"
            local args=(-LsS --connect-timeout 5 --max-time 15 -o "$out")
            if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
              args+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
            fi
            curl "${args[@]}" -w '%{http_code}\t%{url_effective}\t%{content_type}' "$url" 2>/dev/null || true
          }

          echo "Deployment URL: $AXIS_DEPLOYMENT_URL"
          echo "Expected source commit: $AXIS_EXPECTED_SHA"
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo 'Automation bypass: configured'
          else
            echo 'Automation bypass: not configured'
          fi
          echo 'Production candidates:'
          cat /tmp/axis-production-candidates.txt

          protected_seen=0
          json_seen=0
          for attempt in $(seq 1 10); do
            while IFS= read -r base; do
              test -n "$base" || continue
              meta=$(axis_curl "$base/axis-build.json" /tmp/axis-candidate-build.json)
              result=$(EXPECTED="$AXIS_EXPECTED_SHA" node <<'NODE'
          const fs=require('fs');
          let out={kind:'unreadable',version:null,sourceCommit:null,bytes:0,exact:false,protected:false};
          try{
            const raw=fs.readFileSync('/tmp/axis-candidate-build.json','utf8');out.bytes=Buffer.byteLength(raw);
            try{
              const x=JSON.parse(raw);
              out={kind:'json',version:x.version||null,sourceCommit:x.sourceCommit||null,bytes:out.bytes,exact:x.sourceCommit===process.env.EXPECTED&&x.version==='8.7.12',protected:false};
            }catch{
              const m=raw.match(/<title[^>]*>([^<]{0,120})<\/title>/i);
              out.kind='html-or-text';out.title=m?.[1]||raw.slice(0,80).replace(/\s+/g,' ');
              out.protected=/Login\s*[–—-]\s*Vercel|Vercel Authentication|Deployment Protection/i.test(raw);
            }
          }catch{}
          process.stdout.write(JSON.stringify(out));
          NODE
              )
              if [ "$attempt" -eq 1 ]; then echo "Candidate · $base · $meta · $result"; fi

              if RESULT="$result" node -e "const x=JSON.parse(process.env.RESULT);process.exit(x.exact?0:1)"; then
                cp /tmp/axis-candidate-build.json /tmp/axis-build.json
                echo "AXIS_URL=$base" >> "$GITHUB_ENV"
                echo "AXIS_PRODUCTION_GATE_STATE=verified" >> "$GITHUB_ENV"
                echo "Resolved exact Production endpoint: $base"
                root_args=(-LfsS --connect-timeout 5 --max-time 15)
                if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then root_args+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}"); fi
                curl "${root_args[@]}" "$base/" -o /tmp/axis-production-index.html
                echo "Production root · $(wc -c </tmp/axis-production-index.html) bytes"
                exit 0
              fi

              kind=$(RESULT="$result" node -p "JSON.parse(process.env.RESULT).kind")
              protected=$(RESULT="$result" node -p "JSON.parse(process.env.RESULT).protected?'1':'0'")
              if [ "$kind" = 'json' ]; then json_seen=1; fi
              if [ "$protected" = '1' ]; then protected_seen=1; fi
            done </tmp/axis-production-candidates.txt
            echo "Exact Production endpoint not ready yet · attempt $attempt/10"
            sleep 3
          done

          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ] && [ "$protected_seen" -eq 1 ] && [ "$json_seen" -eq 0 ]; then
            echo "AXIS_PRODUCTION_PROTECTED=1" >> "$GITHUB_ENV"
            echo "AXIS_PRODUCTION_GATE_STATE=protected" >> "$GITHUB_ENV"
            echo '::notice title=AXIS Production protected::Vercel Deployment Protection blocks anonymous production verification. Configure VERCEL_AUTOMATION_BYPASS_SECRET to enable the full external Chromium gate.'
            {
              echo '### AXIS Production gate — protected'
              echo ''
              echo '- Vercel reported the Production deployment as successful.'
              echo '- Every plausible deployment/project endpoint was either Vercel Authentication protected or absent.'
              echo '- No public AXIS manifest was observed, so this is not classified as an AXIS runtime failure.'
              echo '- Full asset + Chromium verification is already wired and will run automatically when `VERCEL_AUTOMATION_BYPASS_SECRET` is available.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'No endpoint served the exact deployed commit, and the result was not solely Vercel protection.'
          exit 1

      - name: Verify hardened production manifest and immutable assets
        if: env.AXIS_PRODUCTION_PROTECTED != '1'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/axis-build.json','utf8'));
          const fail=m=>{throw new Error(m)};
          if(x.sourceCommit!==process.env.AXIS_EXPECTED_SHA)fail(`source commit mismatch ${x.sourceCommit}`);
          if(x.version!=='8.7.12')fail(`unexpected version ${x.version}`);
          if(x.baseVersion!=='8.7.11')fail(`unexpected base ${x.baseVersion}`);
          if(x.architecture!=='hardened-chunk-kernel+nonblocking-feature')fail(`unexpected architecture ${x.architecture}`);
          for(const k of ['interactionPriorityKernel','shellObserverIsolation','coreOwnsDockVisibility','optionalRuntimeNonBlocking','sourceCommitStamped'])if(x.gates?.[k]!==true)fail(`missing gate ${k}`);
          if(!/^[a-f0-9]{12}$/.test(x.assets?.core||''))fail('invalid core hash');
          if(!/^[a-f0-9]{12}$/.test(x.assets?.css||''))fail('invalid css hash');
          if(!Array.isArray(x.assets?.chunks)||x.assets.chunks.length!==4)fail('expected four stable chunks');
          if(x.featureKernel?.feature!=='v8712-runtime.js'||!/^[a-f0-9]{12}$/.test(x.featureKernel?.hash||''))fail('invalid optional feature contract');
          const assets=[
            ['core',`/axis-core.js?v=${x.assets.core}`,20000],
            ['css',`/axis-style.css?v=${x.assets.css}`,10000],
            ...x.assets.chunks.map(c=>[`chunk:${c.id}`,`/${c.file}?v=${c.hash}`,Math.max(4000,Math.min(20000,Math.floor((c.bytes||8000)*0.4)))]),
            ['feature:8.7.12',`/${x.featureKernel.feature}?v=${x.featureKernel.hash}`,4000]
          ];
          for(const [name,url] of assets){if(!/^\/[A-Za-z0-9._-]+\.js\?v=[a-f0-9]{12}$/.test(url)&&!/^\/axis-style\.css\?v=[a-f0-9]{12}$/.test(url))fail(`unsafe asset ${name}: ${url}`)}
          fs.writeFileSync('/tmp/axis-assets.tsv',assets.map(a=>a.join('\t')).join('\n')+'\n');
          console.log(`[AXIS production manifest] ${x.version} · ${x.sourceCommit.slice(0,10)} · ${assets.length} immutable assets`);
          NODE

          curl_asset(){
            local url="$1" out="$2"
            local args=(-LfsS --connect-timeout 5 --max-time 20 -o "$out")
            if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then args+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}"); fi
            curl "${args[@]}" "$url"
          }

          i=0
          while IFS=$'\t' read -r name path min_bytes; do
            test -n "$name" || continue
            out="/tmp/axis-production-asset-$i"
            curl_asset "$AXIS_URL$path" "$out"
            bytes=$(wc -c <"$out")
            if [ "$bytes" -lt "$min_bytes" ]; then
              echo "Asset too small: $name · $bytes bytes · expected >= $min_bytes"
              exit 1
            fi
            echo "Asset OK · $name · $bytes bytes · $path"
            i=$((i+1))
          done </tmp/axis-assets.tsv
          test "$i" -eq 7

      - name: Prepare real-browser harness
        if: env.AXIS_PRODUCTION_PROTECTED != '1'
        shell: bash
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Real Chromium smoke against deployed production
        if: env.AXIS_PRODUCTION_PROTECTED != '1'
        run: node scripts/run-smoke-guarded.mjs

      - name: Record protected Production status
        if: env.AXIS_PRODUCTION_PROTECTED == '1'
        run: echo '[AXIS production gate] PROTECTED · Vercel deployment succeeded; external browser gate awaits automation bypass secret.'
