name: AXIS Production Deployment Gate

on:
  deployment_status:

concurrency:
  group: axis-production-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  production-browser-gate:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AXIS_URL: ${{ github.event.deployment_status.environment_url }}
    steps:
      - name: Checkout the exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'

      - name: Wait for the production edge
        shell: bash
        run: |
          set -euo pipefail
          echo "Production URL: $AXIS_URL"
          for i in $(seq 1 20); do
            if curl -LfsS --connect-timeout 5 --max-time 15 "$AXIS_URL/" >/tmp/axis-production-index.html; then
              echo "Production edge reachable · $(wc -c </tmp/axis-production-index.html) bytes"
              exit 0
            fi
            sleep 3
          done
          echo "Production deployment never became reachable"
          exit 1

      - name: Verify hardened production manifest and immutable assets
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS --connect-timeout 5 --max-time 15 "$AXIS_URL/axis-build.json" -o /tmp/axis-build.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/axis-build.json','utf8'));
          const fail=m=>{throw new Error(m)};
          if(x.version!=='8.7.12')fail(`unexpected version ${x.version}`);
          if(x.baseVersion!=='8.7.11')fail(`unexpected base ${x.baseVersion}`);
          if(x.architecture!=='hardened-chunk-kernel+nonblocking-feature')fail(`unexpected architecture ${x.architecture}`);
          for(const k of ['interactionPriorityKernel','shellObserverIsolation','coreOwnsDockVisibility','optionalRuntimeNonBlocking'])if(x.gates?.[k]!==true)fail(`missing gate ${k}`);
          if(!/^[a-f0-9]{12}$/.test(x.assets?.core||''))fail('invalid core hash');
          if(!/^[a-f0-9]{12}$/.test(x.assets?.css||''))fail('invalid css hash');
          if(!Array.isArray(x.assets?.chunks)||x.assets.chunks.length!==4)fail('expected four stable chunks');
          if(x.featureKernel?.feature!=='v8712-runtime.js'||!/^[a-f0-9]{12}$/.test(x.featureKernel?.hash||''))fail('invalid optional feature contract');
          const assets=[
            ['core',`/axis-core.js?v=${x.assets.core}`,20000],
            ['css',`/axis-style.css?v=${x.assets.css}`,10000],
            ...x.assets.chunks.map(c=>[`chunk:${c.id}`,`/${c.file}?v=${c.hash}`,Math.max(4000,Math.min(20000,Math.floor((c.bytes||8000)*0.4)))]),
            ['feature:8.7.12',`/${x.featureKernel.feature}?v=${x.featureKernel.hash}`,4000]
          ];
          for(const [name,url,min] of assets){if(!/^\/[A-Za-z0-9._-]+\.js\?v=[a-f0-9]{12}$/.test(url)&&!/^\/axis-style\.css\?v=[a-f0-9]{12}$/.test(url))fail(`unsafe asset ${name}: ${url}`)}
          fs.writeFileSync('/tmp/axis-assets.tsv',assets.map(a=>a.join('\t')).join('\n')+'\n');
          console.log(`[AXIS production manifest] ${x.version} · ${x.architecture} · ${assets.length} immutable assets`);
          NODE

          i=0
          while IFS=$'\t' read -r name path min_bytes; do
            test -n "$name" || continue
            out="/tmp/axis-production-asset-$i"
            curl -LfsS --connect-timeout 5 --max-time 20 "$AXIS_URL$path" -o "$out"
            bytes=$(wc -c <"$out")
            if [ "$bytes" -lt "$min_bytes" ]; then
              echo "Asset too small: $name · $bytes bytes · expected >= $min_bytes"
              exit 1
            fi
            echo "Asset OK · $name · $bytes bytes · $path"
            i=$((i+1))
          done </tmp/axis-assets.tsv
          test "$i" -eq 7

      - name: Prepare real-browser harness
        shell: bash
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Real Chromium smoke against deployed production
        run: node scripts/run-smoke-guarded.mjs
