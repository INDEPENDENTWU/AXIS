name: AXIS Production Deployment Gate

on:
  deployment_status:

concurrency:
  group: axis-production-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  production-browser-gate:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AXIS_URL: https://axis-five-puce.vercel.app
      AXIS_EXPECTED_SHA: ${{ github.event.deployment.sha }}
    steps:
      - name: Checkout exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Load release contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('release-contract.json','utf8'));
          for(const k of ['publicVersion','stableBaseVersion','architecture','stableChunkCount'])if(c[k]===undefined||c[k]===null||c[k]==='')throw new Error(`release-contract missing ${k}`);
          console.log(`AXIS_EXPECTED_VERSION=${c.publicVersion}`);
          console.log(`AXIS_EXPECTED_BASE=${c.stableBaseVersion}`);
          console.log(`AXIS_EXPECTED_ARCH=${c.architecture}`);
          NODE
      - name: Wait for fixed Production URL to serve exact source commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code=$(curl -LsS --connect-timeout 5 --max-time 15 -o /tmp/axis-build.json -w '%{http_code}' "$AXIS_URL/axis-build.json" || true)
            if [ "$code" = "200" ]; then
              if EXPECTED="$AXIS_EXPECTED_SHA" VERSION="$AXIS_EXPECTED_VERSION" ARCH="$AXIS_EXPECTED_ARCH" node <<'NODE'
          const fs=require('fs');
          try{
            const x=JSON.parse(fs.readFileSync('/tmp/axis-build.json','utf8'));
            process.exit(x.sourceCommit===process.env.EXPECTED&&x.version===process.env.VERSION&&x.baseVersion===process.env.VERSION&&x.architecture===process.env.ARCH?0:1);
          }catch{process.exit(1)}
          NODE
              then
                curl -LfsS --connect-timeout 5 --max-time 15 "$AXIS_URL/" -o /tmp/axis-production-index.html
                exit 0
              fi
            fi
            echo "Attempt $attempt · public Production not yet exact ($code) · waiting for $AXIS_EXPECTED_SHA"
            sleep 3
          done
          echo "::error title=AXIS Production stale or protected::${AXIS_URL} did not anonymously serve exact deployed commit ${AXIS_EXPECTED_SHA}."
          exit 1
      - name: Verify 8.8.1 canonical Production manifest and immutable assets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/axis-build.json','utf8'));
          const html=fs.readFileSync('/tmp/axis-production-index.html','utf8');
          const fail=m=>{throw new Error(m)};
          if(x.sourceCommit!==process.env.AXIS_EXPECTED_SHA)fail(`source commit mismatch ${x.sourceCommit}`);
          if(x.version!==process.env.AXIS_EXPECTED_VERSION||x.baseVersion!==process.env.AXIS_EXPECTED_BASE)fail(`release identity mismatch ${x.version}/${x.baseVersion}`);
          if(x.architecture!=='canonical-single-runtime'||x.architecture!==process.env.AXIS_EXPECTED_ARCH)fail(`unexpected architecture ${x.architecture}`);
          if(x.requests?.initialJavascript!==1||x.requests?.dynamicJavascript!==0)fail(`unexpected JS topology ${JSON.stringify(x.requests)}`);
          if(!Array.isArray(x.assets?.chunks)||x.assets.chunks.length!==0)fail('historical dynamic chunks survived');
          const required=[
            'canonicalSingleRuntime','noDynamicRuntimeChunks','noVersionFallback','historicalReleaseWriterRetired','sourceCommitStamped',
            'singleActiveAdjustmentOwner','legacyV8710ActiveAdjustRetired','catalogCategorySingleOwner','capturePreferenceSingleOwner','canonicalReplacementPreservesDoubleDollar',
            'watermarkFourSwitchContract','precisePlaceResolver','noRawCoordinatePresentation','watermarkSingleLocateOwner','watermarkPreferenceSingleWriter',
            'groupPlanUnitlessControls','groupPlanExpandedPresets','activeItemCountdown','activeItemCountdownTone','activeItemLongPressSuppressesTone','watermarkCenterBrand','watermarkBrandOpacitySingleTarget'
          ];
          for(const k of required)if(x.gates?.[k]!==true)fail(`missing Production gate ${k}`);
          if(x.featureKernel?.embedded!==true||x.completionKernel?.embedded!==true)fail('feature/completion are not embedded');
          if(x.canonical?.minorRelease!==process.env.AXIS_EXPECTED_VERSION)fail(`minor release contract mismatch ${x.canonical?.minorRelease}`);
          if(x.canonical?.activeCountdown?.toneOwner!=='v87'||x.canonical?.activeCountdown?.longPressSuppressesTone!==true)fail('countdown owner contract mismatch');
          if(x.canonical?.watermarkBrand?.text!=='AXIS'||x.canonical?.watermarkBrand?.opacityOwner!=='v876WmOpacity')fail('brand owner contract mismatch');
          if(!/^[a-f0-9]{12}$/.test(x.assets?.core||'')||!/^[a-f0-9]{12}$/.test(x.assets?.css||''))fail('invalid immutable asset hash');
          const scripts=[...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(m=>m[1]);
          if(scripts.length!==1||scripts[0]!==`/axis-core.js?v=${x.assets.core}`)fail(`Production HTML script mismatch ${scripts}`);
          if(!html.includes(`data-axis-runtime="canonical-${process.env.AXIS_EXPECTED_VERSION}"`))fail('canonical HTML marker missing');
          if(/AXIS_FEATURE_LOADER_START|AXIS_COMPLETION_LOADER_START|axis-enhance-(foundation|recording|interaction|product)\.js/.test(html))fail('retired dynamic loader survives in Production HTML');
          fs.writeFileSync('/tmp/axis-assets.tsv',`core\t/axis-core.js?v=${x.assets.core}\t20000\ncss\t/axis-style.css?v=${x.assets.css}\t10000\n`);
          console.log(`[AXIS Production] ${x.version} · ${x.sourceCommit.slice(0,10)} · canonical 8.8.1 contracts verified`);
          NODE
          while IFS=$'\t' read -r name path min_bytes; do
            test -n "$name" || continue
            out="/tmp/axis-production-$name"
            curl -LfsS --connect-timeout 5 --max-time 20 "$AXIS_URL$path" -o "$out"
            bytes=$(wc -c <"$out")
            test "$bytes" -ge "$min_bytes" || { echo "$name asset too small: $bytes"; exit 1; }
            echo "Asset OK · $name · $bytes bytes"
          done </tmp/axis-assets.tsv
      - name: Prepare real Chromium harness
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Real Chromium product gates against fixed Production URL
        run: |
          node scripts/run-smoke-guarded.mjs
          node scripts/axis-completion-smoke.mjs
          node scripts/axis-88-smoke.mjs
          AXIS_ENGINE=chromium node scripts/axis-catalog-smoke.mjs
          AXIS_ENGINE=chromium node scripts/axis-watermark-smoke.mjs
          AXIS_ENGINE=chromium node scripts/axis-881-smoke.mjs
          node scripts/axis-product-matrix.mjs
