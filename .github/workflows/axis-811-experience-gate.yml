name: AXIS 8.11 Experience Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/learning-atlas-811.mjs'
      - 'lib/learning-atlas-811/**'
      - 'lib/multilingual-atlas-811.mjs'
      - 'prepare-811-learning-atlas.mjs'
      - 'prepare-811-dialogue-depth.mjs'
      - 'prepare-811-multilingual-atlas.mjs'
      - 'prepare-811-learning-settings.mjs'
      - 'prepare-811-trends.mjs'
      - 'prepare-811-trends-motion.mjs'
      - 'prepare-811-cloud-ai-settings.mjs'
      - 'prepare-811-legacy-compat.mjs'
      - 'postbuild-811-contract.mjs'
      - 'scripts/axis-811-experience-smoke.mjs'
      - 'build-release.mjs'
      - '.github/workflows/axis-811-experience-gate.yml'
  workflow_dispatch:

jobs:
  experience:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Syntax
        run: |
          for f in lib/learning-atlas-811/*.mjs; do node --check "$f"; done
          node --check lib/learning-atlas-811.mjs
          node --check lib/multilingual-atlas-811.mjs
          node --check prepare-811-learning-atlas.mjs
          node --check prepare-811-dialogue-depth.mjs
          node --check prepare-811-multilingual-atlas.mjs
          node --check prepare-811-learning-settings.mjs
          node --check prepare-811-trends.mjs
          node --check prepare-811-trends-motion.mjs
          node --check prepare-811-cloud-ai-settings.mjs
          node --check prepare-811-legacy-compat.mjs
          node --check postbuild-811-contract.mjs
          node --check scripts/axis-811-experience-smoke.mjs
      - name: Build full inherited release
        run: node build-release.mjs
      - name: Experience smoke
        run: node scripts/axis-811-experience-smoke.mjs