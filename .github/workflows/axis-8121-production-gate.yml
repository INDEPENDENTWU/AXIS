name: AXIS 8.12.x Production Gate

on:
  deployment_status:

concurrency:
  group: axis-812x-production-${{ github.event.deployment.id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-hotfix:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      AXIS_URL: https://axis-five-puce.vercel.app
      AXIS_EXPECTED_SHA: ${{ github.event.deployment.sha }}
    steps:
      - name: Checkout exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact deployed source
        run: node build-release.mjs
      - name: Resolve historical 8.12.x deployment scope
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const x=require('./axis-build.json');
          const supported=['8.12.1','8.12.2','8.12.3','8.12.4'];
          const active=supported.includes(x.version);
          if(active&&x.baseVersion!==x.version)throw new Error(`invalid 8.12 patch identity ${x.version}/${x.baseVersion}`);
          console.log(`AXIS_812X_ACTIVE=${active?'true':'false'}`);
          if(active){
            console.log(`AXIS_EXPECTED_VERSION=${x.version}`);
            console.error(`[AXIS 8.12.x Production] active historical release ${x.version}`);
          }else{
            console.error(`[AXIS 8.12.x Production] skip · deployed release ${x.version}/${x.baseVersion} is outside historical 8.12.1–8.12.4 scope`);
          }
          NODE
      - name: Verify fixed alias serves exact AXIS 8.12.x artifact
        if: env.AXIS_812X_ACTIVE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code=$(curl -LsS --connect-timeout 5 --max-time 15 -o /tmp/axis-812x-build.json -w '%{http_code}' "$AXIS_URL/axis-build.json" || true)
            if [ "$code" = "200" ] && EXPECTED="$AXIS_EXPECTED_SHA" VERSION="$AXIS_EXPECTED_VERSION" node <<'NODE'
          const fs=require('fs');
          try{
            const x=JSON.parse(fs.readFileSync('/tmp/axis-812x-build.json','utf8'));
            const ok=x.sourceCommit===process.env.EXPECTED&&x.version===process.env.VERSION&&x.baseVersion===process.env.VERSION&&x.architecture==='canonical-single-runtime'&&x.requests?.initialJavascript===1&&x.requests?.dynamicJavascript===0&&Array.isArray(x.assets?.chunks)&&x.assets.chunks.length===0&&x.gates?.groupPlanUsesRecordingOwner===true&&x.gates?.languageStudio812===true&&x.gates?.liveRouteReadOnly813===true;
            process.exit(ok?0:1);
          }catch{process.exit(1)}
          NODE
            then exit 0; fi
            echo "Attempt $attempt · waiting for exact AXIS $AXIS_EXPECTED_VERSION Production"
            sleep 3
          done
          exit 1
      - name: Align inherited browser assertions
        if: env.AXIS_812X_ACTIVE == 'true'
        run: node scripts/prepare-release-test-contract.mjs
      - name: Prepare Chromium
        if: env.AXIS_812X_ACTIVE == 'true'
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Real AXIS 8.12 Language Studio on fixed Production
        if: env.AXIS_812X_ACTIVE == 'true'
        env:
          AXIS_ENGINE: chromium
        run: node scripts/axis-812-browser-smoke.mjs
      - name: Real inherited field hotfix on fixed Production
        if: env.AXIS_812X_ACTIVE == 'true'
        env:
          AXIS_ENGINE: chromium
        run: node scripts/axis-8121-hotfix-smoke.mjs
      - name: Real AXIS 8.12.2 Settings on fixed Production
        if: env.AXIS_812X_ACTIVE == 'true' && contains(fromJSON('["8.12.2","8.12.3","8.12.4"]'), env.AXIS_EXPECTED_VERSION)
        env:
          AXIS_ENGINE: chromium
        run: node scripts/axis-8122-settings-smoke.mjs
      - name: Real AXIS 8.12.3 learning simplification on fixed Production
        if: env.AXIS_812X_ACTIVE == 'true' && contains(fromJSON('["8.12.3","8.12.4"]'), env.AXIS_EXPECTED_VERSION)
        env:
          AXIS_ENGINE: chromium
        run: node scripts/axis-8123-learning-simplify-smoke.mjs
      - name: Real AXIS 8.12.4 truthful training flow on fixed Production
        if: env.AXIS_812X_ACTIVE == 'true' && env.AXIS_EXPECTED_VERSION == '8.12.4'
        env:
          AXIS_ENGINE: chromium
        run: node scripts/axis-8124-flow-smoke.mjs
