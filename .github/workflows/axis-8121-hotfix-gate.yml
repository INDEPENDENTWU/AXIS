name: AXIS 8.12.x Field Hotfix Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact inherited field candidate
        run: node build-release.mjs
      - name: Verify release and ownership topology
        run: |
          node - <<'NODE'
          const fs=require('fs'),m=require('./axis-build.json'),core=fs.readFileSync('axis-core.js','utf8');
          const compatible=['8.12.1','8.12.2','8.12.3','8.12.4','8.12.5','8.13','8.13.1','8.14','8.15','8.15.1','8.16','8.17','8.18'];
          if(!compatible.includes(m.version)||m.baseVersion!==m.version)throw new Error(`release mismatch ${m.version}/${m.baseVersion}`);
          if(m.architecture!=='canonical-single-runtime'||m.requests?.initialJavascript!==1||m.requests?.dynamicJavascript!==0||m.assets?.chunks?.length!==0)throw new Error('runtime topology drift');
          if(!core.includes('__AXIS_8121_HOTFIX__')||!core.includes('v8121PlanButton'))throw new Error('8.12.1 inherited field marker missing');
          for(const gate of ['groupPlanUsesRecordingOwner','canonicalSingleRuntime','languageStudio812','liveRoute813','liveRouteReadOnly813'])if(m.gates?.[gate]!==true)throw new Error(`inherited gate missing ${gate}`);
          NODE
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-8121-chromium.log 2>&1 &
          sleep 1
      - name: Inherited Settings + real record Group Plan
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: chromium
        run: node scripts/axis-8121-hotfix-smoke.mjs
      - name: Repository contract
        run: node scripts/axis-repository-contract.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-8121-chromium.log || true

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact inherited field candidate
        run: node build-release.mjs
      - name: Prepare iPhone WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-8121-webkit.log 2>&1 &
          sleep 1
      - name: iPhone inherited Settings + real record Group Plan
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: webkit
        run: node scripts/axis-8121-hotfix-smoke.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-8121-webkit.log || true
