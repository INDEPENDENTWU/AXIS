name: AXIS Public Production Alias Gate

on:
  deployment_status:

concurrency:
  group: axis-public-production-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  verify-fixed-production-alias:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    env:
      AXIS_PUBLIC_URL: https://axis-five-puce.vercel.app
      AXIS_EXPECTED_SHA: ${{ github.event.deployment.sha }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Resolve identity from the same release build
        shell: bash
        run: |
          set -euo pipefail
          node build-release.mjs
          node <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('axis-build.json','utf8'));
          for(const k of ['version','baseVersion','architecture'])if(x[k]===undefined||x[k]===null||x[k]==='')throw new Error(`axis-build missing ${k}`);
          console.log(`AXIS_EXPECTED_VERSION=${x.version}`);
          console.log(`AXIS_EXPECTED_BASE=${x.baseVersion}`);
          console.log(`AXIS_EXPECTED_ARCH=${x.architecture}`);
          NODE
      - name: Wait for fixed public alias to serve exact release
        shell: bash
        run: |
          set -euo pipefail
          axis_curl(){
            local out="$1"
            local args=(-LfsS --connect-timeout 5 --max-time 15 -o "$out")
            if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
              args+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
            fi
            curl "${args[@]}" "$AXIS_PUBLIC_URL/axis-build.json"
          }
          for attempt in $(seq 1 20); do
            if axis_curl /tmp/axis-public-build.json 2>/dev/null; then
              if EXPECTED="$AXIS_EXPECTED_SHA" VERSION="$AXIS_EXPECTED_VERSION" BASE="$AXIS_EXPECTED_BASE" ARCH="$AXIS_EXPECTED_ARCH" node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/axis-public-build.json','utf8'));
          const requiredGates=[
            'canonicalSingleRuntime','noDynamicRuntimeChunks','noVersionFallback','historicalReleaseWriterRetired','singleActiveAdjustmentOwner','legacyV8710ActiveAdjustRetired','catalogCategorySingleOwner','capturePreferenceSingleOwner','canonicalReplacementPreservesDoubleDollar',
            'watermarkFourSwitchContract','precisePlaceResolver','noRawCoordinatePresentation','watermarkSingleLocateOwner','watermarkPreferenceSingleWriter','groupPlanUnitlessControls','groupPlanExpandedPresets','activeItemCountdown','activeItemCountdownTone','activeItemLongPressSuppressesTone','watermarkCenterBrand','watermarkBrandOpacitySingleTarget',
            'homeStateSingleOwner','homeStateAdaptiveRest','localVisualMemory','quickCustomEquipment','quickMediaAttachment','activeCardGeometryStable','countdownOnlyAutomaticSound','expandedExerciseLibrary','waistAnatomyRegion','durableReleaseLog','mediaStoreWebKitSafe','sourceCommitStamped',
            'learningAtlas811','learningAtlasUnique811','learningDialogueSixTurn811','learningConnectedSpeech811','learningSpelling811','learningSettingsConverged811','learningLegacyDiagnosticsPreserved811','learningJapanese132811','learningKorean132811','learningChinese132811','learningMultilingualSixTurn811','learningMultilingualNoLegacyExactOverlap811','trendsStateField811','trendsGoalAware811','trendsEvidenceOnly811','trendsLocalFirst811','trendsOneShotMotion811','serviceSettingsConverged811','serviceSettingsUserInvokedNetwork811','serviceSettingsNoTrainingOwner811'
          ];
          const v=process.env.VERSION;
          const is812=['8.12','8.12.1','8.12.2','8.12.3','8.12.4'].includes(v);
          const has811=v==='8.11'||is812;
          if(is812)requiredGates.push(
            'languageStudio812','languageCorpusExpanded812','nativeMultilingual812','dialogueTailDiversity812','dialogueDepthSelectable812','teachingLoop812','activeRecall812','transformPractice812','learningSettingsPurpose812','learningSettingsMethod812','learningSettingsNovelty812','legacy811Preserved812','learningNoAutoplay812','learningLocalFirst812','learningNoTrainingOwner812','liveRouteReadOnly813'
          );
          if(['8.12.3','8.12.4'].includes(v))requiredGates.push('settingsNativeAlignment8123','settingsHelperCopyRetired8123','learningSettingsMethodRetired8123','learningShadowUiRetired8123','learningSimpleAudio8123','learningLocalRecording8123','learningNoUpload8123','learningNoTrainingOwner8123');
          if(v==='8.12.4')requiredGates.push('trainingIntervalUnion8124','projectGapLatestActivity8124','sessionStartEndBounds8124','sessionActivitySeal8124','quickRecordDirectRecent8124','liveRouteActionDelegate8124','liveRouteDeviationSafe8124','settingsVerticalNative8124');
          const axis811Ok=!has811||(
            x.axis811?.release===true &&
            x.axis811?.learning?.totalEnglish===5736 && x.axis811?.learning?.totalUnits===6132 && x.axis811?.learning?.dialogueTurns===6 &&
            x.axis811?.learning?.availableByLanguage?.ja===132 && x.axis811?.learning?.availableByLanguage?.ko===132 && x.axis811?.learning?.availableByLanguage?.zh===132 &&
            x.axis811?.trends?.model==='state-field-trajectory' && x.axis811?.trends?.fitnessScore===false &&
            x.axis811?.services?.localFirst===true && x.axis811?.services?.automaticNetwork===false
          );
          const axis812Ok=!is812||(
            x.axis812?.release===true &&
            x.axis812?.learning?.totalNew===19584 && x.axis812?.learning?.totalAvailable===25716 &&
            x.axis812?.learning?.availableByLanguage?.en===10632 && x.axis812?.learning?.availableByLanguage?.ja===5028 && x.axis812?.learning?.availableByLanguage?.ko===5028 && x.axis812?.learning?.availableByLanguage?.zh===5028 &&
            x.axis812?.learning?.dialogueTurns?.short===4 && x.axis812?.learning?.dialogueTurns?.full===8 && x.axis812?.learning?.dialogueTurns?.immersive===12 &&
            x.axis812?.learning?.teachingLoop?.join('|')==='meaning|noticing|retrieval|response|shadow|transform|review' &&
            x.axis812?.learning?.networkRequired===false && x.axis812?.learning?.autoplay===false && x.axis812?.learning?.trainingOwner===false
          );
          const axis8124Ok=v!=='8.12.4'||(
            x.axis8124?.liveRoute?.readOnly===true && x.axis8124?.liveRoute?.deviationPenalty===false &&
            x.axis8124?.quickRecord?.recentDirect===true && x.axis8124?.settings?.learningAndCloudNativeVerticalGeometry===true
          );
          const ok=x.sourceCommit===process.env.EXPECTED && x.version===v && x.baseVersion===process.env.BASE && x.architecture===process.env.ARCH &&
            x.architecture==='canonical-single-runtime' && x.requests?.initialJavascript===1 && x.requests?.dynamicJavascript===0 && Array.isArray(x.assets?.chunks) && x.assets.chunks.length===0 &&
            x.canonical?.retiredCatalogWriters===1 && x.canonical?.locateOwner==='v8710 canonical precise resolver' && x.canonical?.preferenceOwner==='v85 setWm event bridge' && x.canonical?.rawCoordinatePresentation===false &&
            x.canonical?.version===v && x.canonical?.watermarkBrand?.text==='AXIS' && x.canonical?.watermarkBrand?.opacityOwner==='v876WmOpacity' &&
            x.canonical?.activeCountdown?.toneOwner==='v8710-sound-ui.js' && x.canonical?.activeCountdown?.longPressSuppressesTone===true && x.canonical?.activeCountdown?.automaticTrigger==='countdown-zero-only' &&
            x.canonical?.mediaStore?.owner==='app.js' && x.canonical?.mediaStore?.writeFormat==='arraybuffer-v1' && x.canonical?.mediaStore?.webkitSafe===true &&
            requiredGates.every(k=>x.gates?.[k]===true) && axis811Ok && axis812Ok && axis8124Ok;
          if(!ok){
            console.error(JSON.stringify({expected:{sourceCommit:process.env.EXPECTED,version:v,baseVersion:process.env.BASE,architecture:process.env.ARCH},actual:{sourceCommit:x.sourceCommit,version:x.version,baseVersion:x.baseVersion,architecture:x.architecture},requests:x.requests,axis811:x.axis811,axis812:x.axis812,axis8124:x.axis8124,gates:Object.fromEntries(requiredGates.map(k=>[k,x.gates?.[k]]))},null,2));
            process.exit(1);
          }
          console.log(`[AXIS fixed Production] ${x.version} · ${x.sourceCommit} · exact alias · inherited + current release contracts verified`);
          NODE
              then
                exit 0
              fi
            fi
            echo "Attempt $attempt: fixed alias has not converged to $AXIS_EXPECTED_SHA / $AXIS_EXPECTED_VERSION yet"
            sleep 3
          done
          echo "::error title=AXIS fixed Production mismatch::${AXIS_PUBLIC_URL} did not serve exact built release ${AXIS_EXPECTED_VERSION} at ${AXIS_EXPECTED_SHA}."
          exit 1
