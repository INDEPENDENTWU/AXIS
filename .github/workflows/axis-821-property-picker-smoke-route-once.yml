name: AXIS 8.21 Property Picker Smoke Route Once
on:
  push:
    branches: [fix/821-quick-photo-metric-centering]
    paths:
      - scripts/.axis-821-property-picker-smoke-route-once.mjs
      - .github/workflows/axis-821-property-picker-smoke-route-once.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/821-quick-photo-metric-centering
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply canonical property-picker smoke route
        run: node scripts/.axis-821-property-picker-smoke-route-once.mjs
      - name: Validate source smoke and full deterministic release
        run: |
          node --check scripts/axis-821-recording-property-surface-smoke.mjs
          cp scripts/axis-821-recording-property-surface-smoke.mjs /tmp/axis-821-recording-property-surface-smoke.mjs
          node build-release.mjs
          git reset --hard HEAD
          cp /tmp/axis-821-recording-property-surface-smoke.mjs scripts/axis-821-recording-property-surface-smoke.mjs
      - name: Commit formal smoke route and retire one-shot runner
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/axis-821-property-picker-smoke-route-once.yml scripts/.axis-821-property-picker-smoke-route-once.mjs
          git add scripts/axis-821-recording-property-surface-smoke.mjs
          git diff --cached --check
          git commit -m "test: follow canonical Object property picker route"
          git push origin HEAD:fix/821-quick-photo-metric-centering
