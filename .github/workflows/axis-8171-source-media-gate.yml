name: AXIS 8.17.1 Source Media

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact AXIS candidate
        run: node build-release.mjs
      - name: Verify source-first media manifest
        run: |
          node - <<'NODE'
          const fs=require('fs'),m=require('./axis-build.json'),core=fs.readFileSync('axis-core.js','utf8');
          if(m.version!=='8.18'||m.baseVersion!=='8.18'||m.architecture!=='canonical-single-runtime')throw new Error(`release mismatch ${m.version}/${m.baseVersion}/${m.architecture}`);
          for(const g of ['interactionConvergence817','captureCleanSourceSidecar8171','mediaSourceBridge8171','watermarkSourceFirst8171','evidenceSourceFirst8171','mediaCanonicalFallback8171','mediaEventPointersUnchanged8171','mediaNoNewPersistence8171'])if(m.gates?.[g]!==true)throw new Error(`missing ${g}`);
          if(m.axis8171?.sourceMedia?.sourcePolicy!=='clean-sidecar-v1'||m.axis8171?.sourceMedia?.sourceStore!=='axis_v42_media'||m.axis8171?.sourceMedia?.canonicalPointersUnchanged!==true)throw new Error('8.17.1 source-media manifest drift');
          for(const x of ['__AXIS_MEDIA_SOURCE__','__AXIS_8171_SOURCE_MEDIA__','__AXIS_8171_WATERMARK_SOURCE__','__AXIS_8171_EVIDENCE_SOURCE__'])if(!core.includes(x))throw new Error(`compiled marker missing ${x}`);
          NODE
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-8171-source-chromium.log 2>&1 &
          sleep 1
      - name: Source-first media smoke
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: chromium
        run: node scripts/axis-8171-source-first-media-smoke.mjs
      - name: Inherited 8.17 interaction smoke
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: chromium
        run: node scripts/axis-817-interaction-smoke.mjs
      - name: Inherited 8.16 Capture / Evidence smoke
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: chromium
        run: node scripts/axis-816-capture-evidence-smoke.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-8171-source-chromium.log || true

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact AXIS candidate
        run: node build-release.mjs
      - name: Prepare iPhone WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-8171-source-webkit.log 2>&1 &
          sleep 1
      - name: iPhone source-first media smoke
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: webkit
        run: node scripts/axis-8171-source-first-media-smoke.mjs
      - name: iPhone inherited 8.17 interaction smoke
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: webkit
        run: node scripts/axis-817-interaction-smoke.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-8171-source-webkit.log || true
