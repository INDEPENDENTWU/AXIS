name: AXIS Runtime Gate

on:
  push:
    branches: [main, next-runtime-hardening, release/8.8-canonical-runtime-implementation2]
  pull_request:
    branches: [main]

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Build canonical AXIS 8.8.1 release
        run: node build-release.mjs
      - name: Verify canonical artifact contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('axis-build.json','utf8'));
          if(m.version!=='8.8.1'||m.baseVersion!=='8.8.1')throw new Error('release/base identity mismatch');
          if(m.architecture!=='canonical-single-runtime')throw new Error(`unexpected architecture ${m.architecture}`);
          if(m.requests?.dynamicJavascript!==0||m.assets?.chunks?.length!==0)throw new Error('dynamic runtime chunks survived');
          if(!m.gates?.canonicalSingleRuntime||!m.featureKernel?.embedded||!m.completionKernel?.embedded)throw new Error('canonical gates missing');
          if(!m.gates?.catalogCategorySingleOwner)throw new Error('catalog single-owner gate missing');
          if(!m.gates?.watermarkFourSwitchContract||!m.gates?.precisePlaceResolver||!m.gates?.noRawCoordinatePresentation)throw new Error('watermark canonical gates missing');
          for(const k of ['groupPlanUnitlessControls','groupPlanExpandedPresets','activeItemCountdown','activeItemCountdownTone','activeItemLongPressSuppressesTone','watermarkCenterBrand','watermarkBrandOpacitySingleTarget'])if(!m.gates?.[k])throw new Error(`8.8.1 gate missing ${k}`);
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(x=>x[1]);
          if(scripts.length!==1||!scripts[0].startsWith('/axis-core.js?v='))throw new Error(`unexpected scripts ${scripts}`);
          if(/AXIS_FEATURE_LOADER_START|AXIS_COMPLETION_LOADER_START|axis-enhance-/.test(html))throw new Error('legacy dynamic loader survived in HTML');
          console.log('[AXIS canonical artifact] PASS · 8.8.1 · one runtime · planner/countdown/brand contracts');
          NODE
      - name: Static capture owner audit
        run: node scripts/axis-static-owner-audit.mjs
      - name: Prepare Chromium harness
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Start local production server
        run: |
          python3 -m http.server 4173 >/tmp/axis-http.log 2>&1 &
          echo $! >/tmp/axis-http.pid
          sleep 1
      - name: Canonical capture entry diagnostic
        env:
          AXIS_URL: http://127.0.0.1:4173
        run: node scripts/axis-capture-entry-diag.mjs
      - name: Browser smoke and repeated cold boot
        env:
          AXIS_URL: http://127.0.0.1:4173
        run: node scripts/run-smoke-guarded.mjs
      - name: First-paint shell stability
        env:
          AXIS_URL: http://127.0.0.1:4173
        run: node scripts/axis-first-paint-smoke.mjs
      - name: Inline settings ownership diagnostic
        env:
          AXIS_URL: http://127.0.0.1:4173
        run: node scripts/axis-settings-diag.mjs
      - name: Active adjustment transient diagnostic
        env:
          AXIS_URL: http://127.0.0.1:4173
        run: node scripts/axis-active-adjust-diag.mjs
      - name: Completion interaction regression suite
        env:
          AXIS_URL: http://127.0.0.1:4173
        run: node scripts/axis-completion-smoke.mjs
      - name: AXIS 8.8.1 convergence smoke
        env:
          AXIS_URL: http://127.0.0.1:4173
        run: node scripts/axis-88-smoke.mjs
      - name: Equipment category single-owner regression
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: chromium
        run: node scripts/axis-catalog-smoke.mjs
      - name: Watermark preference + precise place regression
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: chromium
        run: node scripts/axis-watermark-smoke.mjs
      - name: AXIS 8.8.1 planner + countdown + brand regression
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: chromium
        run: node scripts/axis-881-smoke.mjs
      - name: Record-preference affordance diagnostic
        env:
          AXIS_URL: http://127.0.0.1:4173
        run: node scripts/axis-record-prefs-diag.mjs
      - name: Full product operation matrix
        env:
          AXIS_URL: http://127.0.0.1:4173
        run: node scripts/axis-product-matrix.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-http.log || true

  webkit-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Build exact canonical AXIS 8.8.1 artifact
        run: node build-release.mjs
      - name: Prepare WebKit runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start local production server
        run: |
          python3 -m http.server 4173 >/tmp/axis-webkit-http.log 2>&1 &
          echo $! >/tmp/axis-webkit-http.pid
          sleep 1
      - name: iPhone WebKit product smoke
        env:
          AXIS_URL: http://127.0.0.1:4173
        run: node scripts/axis-webkit-smoke.mjs
      - name: iPhone WebKit equipment category regression
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: webkit
        run: node scripts/axis-catalog-smoke.mjs
      - name: iPhone WebKit watermark preference + precise place regression
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: webkit
        run: node scripts/axis-watermark-smoke.mjs
      - name: iPhone WebKit AXIS 8.8.1 planner + countdown + brand regression
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: webkit
        run: node scripts/axis-881-smoke.mjs
      - name: Print WebKit server log on failure
        if: failure()
        run: cat /tmp/axis-webkit-http.log || true
