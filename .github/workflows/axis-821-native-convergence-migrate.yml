name: AXIS 8.21 Native Convergence Migration

on:
  push:
    branches:
      - fix/821-native-flow-recording-convergence

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/821-native-flow-recording-convergence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harden one-shot migration template literals
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/axis-821-native-convergence-migrate.mjs')
          s=p.read_text()
          start="s=replaceFunction(s,'function openQuick()',`"
          end="`,'v61 source-owned quick metadata');"
          a=s.index(start)+len(start)
          b=s.index(end,a)
          segment=s[a:b].replace('${','\\${')
          p.write_text(s[:a]+segment+s[b:])
          PY
      - name: Apply source-owner convergence
        run: node scripts/axis-821-native-convergence-migrate.mjs
      - name: Validate migrated sources
        run: |
          node --check v61.js
          node --check v82-runtime.js
          node --check prepare-882-convergence.mjs
          node --check prepare-821-metric-control-system.mjs
          node --check prepare-821-flow-session-coordination.mjs
          node --check prepare-821-flow-session-coordination-scope.mjs
          node --check scripts/axis-821-item-unit-flow-smoke.mjs
          node --check scripts/axis-821-recording-property-surface-smoke.mjs
          git diff --check
      - name: Commit clean migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "AXIS 8.21 — native whole-item Flow and recording convergence"
          git push origin HEAD:fix/821-native-flow-recording-convergence
