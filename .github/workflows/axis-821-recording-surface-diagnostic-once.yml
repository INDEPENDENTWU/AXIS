name: AXIS 8.21 Recording Surface Diagnostic Once
on:
  push:
    branches: [fix/821-quick-photo-metric-centering]
    paths:
      - scripts/.axis-821-recording-surface-diagnostic-once.mjs
      - .github/workflows/axis-821-recording-surface-diagnostic-once.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/821-quick-photo-metric-centering
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install strict failure diagnostics
        run: node scripts/.axis-821-recording-surface-diagnostic-once.mjs
      - name: Validate smoke syntax
        run: node --check scripts/axis-821-recording-property-surface-smoke.mjs
      - name: Commit diagnostic and retire one-shot runner
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/axis-821-recording-surface-diagnostic-once.yml scripts/.axis-821-recording-surface-diagnostic-once.mjs
          git add scripts/axis-821-recording-property-surface-smoke.mjs
          git diff --cached --check
          git commit -m "test: diagnose recording editor readiness failures"
          git push origin HEAD:fix/821-quick-photo-metric-centering