name: AXIS 8.31 Playable Runtime Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Pure Playable spec and execution idempotency
        run: |
          node scripts/axis-831-playable-smoke.mjs
          node scripts/axis-831-playable-execution-smoke.mjs
          node scripts/axis-831-playable-bridge-contract.mjs
      - name: Build candidate and prove compiled single Runtime
        run: |
          node build-release.mjs
          node postbuild-831-playable-contract.mjs
          node scripts/axis-production-governance-contract.mjs

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build canonical candidate
        run: node build-release.mjs
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-831-chromium.log 2>&1 &
          sleep 1
      - name: Playable → real Flow + Encounter → reload → idempotent completion
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: chromium
        run: node scripts/axis-831-playable-browser-smoke.mjs
      - name: Server diagnostic
        if: failure()
        run: cat /tmp/axis-831-chromium.log || true

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build canonical candidate
        run: node build-release.mjs
      - name: Prepare iPhone WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-831-webkit.log 2>&1 &
          sleep 1
      - name: iPhone WebKit Playable → confirmed Encounter + reload contract
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: webkit
        run: node scripts/axis-831-playable-browser-smoke.mjs
      - name: Server diagnostic
        if: failure()
        run: cat /tmp/axis-831-webkit.log || true
