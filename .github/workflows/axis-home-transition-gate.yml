name: AXIS Home Transition Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  home-transition:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Build exact AXIS artifact
        run: node build-release.mjs
      - name: Apply current browser stability contract
        run: node prepare-8123-ci-stability.mjs
      - name: Prepare browser
        shell: bash
        run: |
          if [ "${{ matrix.engine }}" = "webkit" ]; then
            npm install --no-save playwright@1.55.0
            npx playwright install --with-deps webkit
          else
            npm install --no-save playwright-core@1.55.0
            CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
            test -n "$CHROME_BIN"
            echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          fi
      - name: Start local production server
        run: |
          python3 -m http.server 4173 >/tmp/axis-home-transition.log 2>&1 &
          sleep 1
      - name: Verify 8.8.1 active hierarchy and compact inter-item transition
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: ${{ matrix.engine }}
        run: node scripts/axis-882-home-transition-smoke.mjs
      - name: Verify completed Home and canonical Quick camera
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: ${{ matrix.engine }}
        run: node scripts/axis-882-completion-camera-smoke.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-home-transition.log || true
