name: AXIS 8.14 Evolution Objects

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build inherited AXIS Evolution candidate
        run: node build-release.mjs
      - name: Verify Evolution Object manifest
        run: |
          node - <<'NODE'
          const fs=require('fs'),m=require('./axis-build.json'),core=fs.readFileSync('axis-core.js','utf8');
          if(!['8.14','8.15','8.15.1'].includes(m.version)||m.baseVersion!==m.version)throw new Error(`release mismatch ${m.version}/${m.baseVersion}`);
          if(m.architecture!=='canonical-single-runtime'||m.requests?.initialJavascript!==1||m.requests?.dynamicJavascript!==0||m.assets?.chunks?.length!==0)throw new Error('runtime topology drift');
          for(const g of ['evolutionFoundation8131','trendsMetaActivity8131','evolutionObjects814','evolutionObjectFirstLatest814','evolutionObjectEncounterCount814','evolutionObjectFactualDelta814','evolutionObjectMediaEvidence814','evolutionObjectReadOnly814','evolutionObjectNoNetwork814','evolutionObjectInPlace814'])if(m.gates?.[g]!==true)throw new Error(`missing ${g}`);
          if(m.axis814?.trends?.topLevelOwner!=='v8131-evolution-field'||m.axis814?.trends?.objectOwner!=='v814-evolution-objects'||m.axis814?.ownership?.persistence!==false||m.axis814?.ownership?.network!==false||m.axis814?.ownership?.ai!==false)throw new Error('Evolution Object ownership drift');
          if(!core.includes('__AXIS_814_EVOLUTION_OBJECTS__')||!core.includes('__AXIS_EVOLUTION_OBJECTS__'))throw new Error('compiled Evolution Object missing');
          NODE
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-814-chromium.log 2>&1 &
          sleep 1
      - name: Inherited Evolution foundation
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: chromium
        run: node scripts/axis-8131-evolution-smoke.mjs
      - name: Evolution Object regression
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: chromium
        run: node scripts/axis-814-evolution-object-smoke.mjs
      - name: Repository contract
        run: node scripts/axis-repository-contract.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-814-chromium.log || true

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build inherited AXIS Evolution candidate
        run: node build-release.mjs
      - name: Prepare iPhone WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-814-webkit.log 2>&1 &
          sleep 1
      - name: iPhone inherited Evolution foundation
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: webkit
        run: node scripts/axis-8131-evolution-smoke.mjs
      - name: iPhone Evolution Object regression
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: webkit
        run: node scripts/axis-814-evolution-object-smoke.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-814-webkit.log || true
