name: AXIS Universal Practice Object Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/axis-metric-schema.mjs'
      - 'lib/axis-818-metric-adapter.mjs'
      - 'prepare-818-object-focus-driver.mjs'
      - 'prepare-818-object-focus-foundation.mjs'
      - 'scripts/axis-819-object-recording-contract.mjs'
      - 'scripts/axis-819-object-recording-smoke.mjs'
      - 'build-release.mjs'
      - '.github/workflows/axis-universal-practice-object-gate.yml'
  push:
    branches: [main]
    paths:
      - 'lib/axis-metric-schema.mjs'
      - 'lib/axis-818-metric-adapter.mjs'
      - 'prepare-818-object-focus-driver.mjs'
      - 'prepare-818-object-focus-foundation.mjs'
      - 'scripts/axis-819-object-recording-contract.mjs'
      - 'scripts/axis-819-object-recording-smoke.mjs'
      - 'build-release.mjs'
      - '.github/workflows/axis-universal-practice-object-gate.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 8.18 compatibility → current Metric Schema contract
        run: node scripts/axis-819-object-recording-contract.mjs

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact candidate
        run: node build-release.mjs
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-upo-chromium.log 2>&1 &
          sleep 1
      - name: Object → Recording → Encounter
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-819-object-recording-smoke.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-upo-chromium.log || true

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact candidate
        run: node build-release.mjs
      - name: Prepare iPhone WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-upo-webkit.log 2>&1 &
          sleep 1
      - name: iPhone Object → Recording → Encounter
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-819-object-recording-smoke.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-upo-webkit.log || true
