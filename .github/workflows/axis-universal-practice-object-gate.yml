name: AXIS Universal Practice Object Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/axis-metric-schema.mjs'
      - 'lib/axis-object-capabilities.mjs'
      - 'lib/axis-818-metric-adapter.mjs'
      - 'prepare-818-object-focus-driver.mjs'
      - 'prepare-818-object-focus-foundation.mjs'
      - 'prepare-819-postcommit-lifecycle.mjs'
      - 'prepare-819-release.mjs'
      - 'prepare-820-executable-practice-objects.mjs'
      - 'prepare-8201-object-reliability.mjs'
      - 'prepare-821-object-capability-convergence.mjs'
      - 'prepare-821-executable-object-system-smoke-compat.mjs'
      - 'postbuild-819-upo-seal.mjs'
      - 'postbuild-8201-active-lifecycle-seal.mjs'
      - 'prepare-820-release.mjs'
      - 'scripts/axis-819-object-recording-contract.mjs'
      - 'scripts/axis-821-object-capability-matrix-contract.mjs'
      - 'scripts/axis-819-object-recording-smoke.mjs'
      - 'scripts/axis-820-executable-object-smoke.mjs'
      - 'scripts/axis-8201-object-reliability-smoke.mjs'
      - 'scripts/axis-821-executable-object-system-smoke.mjs'
      - 'build-release.mjs'
      - '.github/workflows/axis-universal-practice-object-gate.yml'
  push:
    branches: [main]
    paths:
      - 'lib/axis-metric-schema.mjs'
      - 'lib/axis-object-capabilities.mjs'
      - 'lib/axis-818-metric-adapter.mjs'
      - 'prepare-818-object-focus-driver.mjs'
      - 'prepare-818-object-focus-foundation.mjs'
      - 'prepare-819-postcommit-lifecycle.mjs'
      - 'prepare-819-release.mjs'
      - 'prepare-820-executable-practice-objects.mjs'
      - 'prepare-8201-object-reliability.mjs'
      - 'prepare-821-object-capability-convergence.mjs'
      - 'prepare-821-executable-object-system-smoke-compat.mjs'
      - 'postbuild-819-upo-seal.mjs'
      - 'postbuild-8201-active-lifecycle-seal.mjs'
      - 'prepare-820-release.mjs'
      - 'scripts/axis-819-object-recording-contract.mjs'
      - 'scripts/axis-821-object-capability-matrix-contract.mjs'
      - 'scripts/axis-819-object-recording-smoke.mjs'
      - 'scripts/axis-820-executable-object-smoke.mjs'
      - 'scripts/axis-8201-object-reliability-smoke.mjs'
      - 'scripts/axis-821-executable-object-system-smoke.mjs'
      - 'build-release.mjs'
      - '.github/workflows/axis-universal-practice-object-gate.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 8.18 compatibility → current Metric Schema contract
        run: node scripts/axis-819-object-recording-contract.mjs
      - name: 8.21 exhaustive Object capability matrix
        run: node scripts/axis-821-object-capability-matrix-contract.mjs

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact candidate
        run: node build-release.mjs
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-upo-chromium.log 2>&1 &
          sleep 1
      - name: 8.19 Object → Recording → Encounter inheritance
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-819-object-recording-smoke.mjs
      - name: 8.20 Explicit Object → Quick Record → immutable Encounter
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-820-executable-object-smoke.mjs
      - name: 8.20.1 Physical custom schema → Active lifecycle reliability
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-8201-object-reliability-smoke.mjs
      - name: 8.21 Full executable Object system
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: chromium }
        run: node scripts/axis-821-executable-object-system-smoke.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-upo-chromium.log || true

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build exact candidate
        run: node build-release.mjs
      - name: Prepare iPhone WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/axis-upo-webkit.log 2>&1 &
          sleep 1
      - name: iPhone 8.19 Object → Recording → Encounter inheritance
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-819-object-recording-smoke.mjs
      - name: iPhone 8.20 Explicit Object → Quick Record → immutable Encounter
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-820-executable-object-smoke.mjs
      - name: iPhone 8.20.1 Physical custom schema → Active lifecycle reliability
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-8201-object-reliability-smoke.mjs
      - name: iPhone 8.21 Full executable Object system
        env: { AXIS_URL: http://127.0.0.1:4173, AXIS_ENGINE: webkit }
        run: node scripts/axis-821-executable-object-system-smoke.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/axis-upo-webkit.log || true
