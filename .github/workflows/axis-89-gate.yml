name: AXIS 8.9 Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Static server/API syntax
        run: |
          node --input-type=module --check < api/analyze.js
          node --input-type=module --check < lib/ai-config.js
          node --check prepare-89-detail.mjs
          node --check prepare-89-vision.mjs
          node --check prepare-89-catalog.mjs
          node --check prepare-89-rest-speak.mjs
          node --check postbuild-89-contract.mjs
      - name: Build AXIS 8.9
        run: node build-release.mjs
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Serve artifact
        run: |
          python3 -m http.server 4173 >/tmp/axis-89-chromium.log 2>&1 &
          sleep 1
      - name: AXIS 8.9 product regression
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: chromium
        run: node scripts/axis-89-smoke.mjs
      - name: Print log on failure
        if: failure()
        run: cat /tmp/axis-89-chromium.log || true

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Build exact AXIS 8.9 artifact
        run: node build-release.mjs
      - name: Prepare WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve artifact
        run: |
          python3 -m http.server 4173 >/tmp/axis-89-webkit.log 2>&1 &
          sleep 1
      - name: AXIS 8.9 iPhone regression
        env:
          AXIS_URL: http://127.0.0.1:4173
          AXIS_ENGINE: webkit
        run: node scripts/axis-89-smoke.mjs
      - name: Print log on failure
        if: failure()
        run: cat /tmp/axis-89-webkit.log || true
