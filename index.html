<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AXIS">
<link rel="manifest" href="/manifest.webmanifest">
<title>AXIS</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><span class="mark"></span>AXIS</div><button class="icon" id="settingsBtn" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.6-.6-1.4 1-1.8-2.1-2.1-1.8 1-1.4-.6L11.5 3h-3L8 5l-1.4.6-1.8-1-2.1 2.1 1 1.8-.6 1.4-2 .6v3l2 .6.6 1.4-1 1.8 2.1 2.1 1.8-1 1.4.6.6 2h3l.6-2 1.4-.6 1.8 1 2.1-2.1-1-1.8.6-1.4z"/></svg></button></header>
<main>
<section class="view active" id="todayView"><div class="head"><h1>今天</h1><div class="date" id="todayDate"></div></div>
<div id="idleHome"><div class="card session"><strong>尚未開始</strong><small id="lastSession">—</small><button class="btn primary full start" id="startBtn"><span class="dot"></span>開始訓練</button></div><div class="stats"><div class="card stat"><b id="weekMins">0</b><span>7D 分鐘</span></div><div class="card stat"><b id="weekSessions">0</b><span>7D 次數</span></div></div><div id="idleSignalWrap" class="hidden"><div class="section"><h2>最近</h2></div><div class="card signal" id="idleSignal"></div></div></div>
<div id="activeHome" class="hidden"><div class="liveHead"><div><div class="liveLabel"><i></i>LIVE</div><div class="timer" id="liveTimer">00:00</div></div><button class="finish" id="finishBtn">結束</button></div><div class="liveStats"><div class="card stat"><b id="liveItems">0</b><span>已記錄</span></div><div class="card stat"><b id="liveSets">0</b><span>總組數</span></div></div><div id="liveSignalWrap" class="hidden"><div class="section"><h2>現在</h2><span id="pace">正常</span></div><div class="card signal" id="liveSignal"></div></div><div class="section"><h2>時間線</h2><span id="eventCount">0</span></div><div class="events" id="eventList"></div></div></section>
<section class="view" id="historyView"><div class="head"><h1>紀錄</h1><div class="date" id="historyCount">0</div></div><div class="events" id="historyList"></div></section>
<section class="view" id="insightsView"><div class="head"><h1>趨勢</h1></div><div class="stats"><div class="card stat"><b id="insightMins">0</b><span>7D 分鐘</span></div><div class="card stat"><b id="insightSessions">0</b><span>30D 次數</span></div></div><div class="section"><h2>30D 結構</h2></div><div class="card bars" id="patternBars"></div><div class="section"><h2>訊號</h2></div><div class="events" id="signals"></div></section>
</main>
<div class="dock" id="dock"><button class="btn accent full" id="scanBtn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.2"/></svg>掃一下</button></div>
<nav class="nav"><div class="navin"><button class="active" data-view="todayView">今日</button><button data-view="historyView">紀錄</button><button data-view="insightsView">趨勢</button></div></nav>
</div>

<div class="sheetWrap" id="scanSheet"><div class="sheet"><div class="handle"></div><div class="sheetHead"><div class="sheetTitle">掃一下</div><button class="close" data-close="scanSheet">×</button></div>
<div id="captureStage"><div class="camera" id="cameraBox"><video id="cameraVideo" playsinline muted></video><div class="fallback hidden" id="cameraFallback">相機不可用，可直接拍一張。</div><div class="scanState" id="scanState">READY</div></div><div class="captureActions"><button class="btn accent" id="liveScanBtn">掃 3 秒</button><button class="btn quiet tinyBtn" id="photoBtn">拍一張</button></div><input class="hiddenInput" id="photoInput" type="file" accept="image/*" capture="environment"></div>
<div id="reviewStage" class="hidden"><div class="film" id="film"></div><div class="card result"><div class="row" id="equipmentRow"><span>器械 / 活動</span><b id="equipmentName">未識別</b></div><div class="row"><span>識別</span><b id="aiStatus">待確認</b></div></div><div id="strengthFields" class="recordGrid hidden"><div class="stepbox"><span>重量 kg</span><div class="stepper"><button data-step="weight" data-delta="-2.5">−</button><b id="weightView">20</b><button data-step="weight" data-delta="2.5">＋</button></div><input id="weight" type="hidden" value="20"></div><div class="stepbox"><span>次數</span><div class="stepper"><button data-step="reps" data-delta="-1">−</button><b id="repsView">10</b><button data-step="reps" data-delta="1">＋</button></div><input id="reps" type="hidden" value="10"></div><div class="stepbox"><span>組數</span><div class="stepper"><button data-step="sets" data-delta="-1">−</button><b id="setsView">3</b><button data-step="sets" data-delta="1">＋</button></div><input id="sets" type="hidden" value="3"></div></div><div id="cardioFields" class="recordGrid cardioGrid hidden"><div class="stepbox"><span>分鐘</span><div class="stepper"><button data-step="duration" data-delta="-5">−</button><b id="durationView">15</b><button data-step="duration" data-delta="5">＋</button></div><input id="duration" type="hidden" value="15"></div><div class="stepbox"><span>強度</span><div class="stepper"><button data-step="intensity" data-delta="-1">−</button><b id="intensityView">5</b><button data-step="intensity" data-delta="1">＋</button></div><input id="intensity" type="hidden" value="5"></div></div><div class="sheetActions"><button class="btn primary full" id="saveScan">記下</button></div></div>
</div></div>

<div class="sheetWrap" id="eqSheet"><div class="sheet"><div class="handle"></div><div class="sheetHead"><div class="sheetTitle">器械 / 活動</div><button class="close" data-close="eqSheet">×</button></div><input class="search" id="eqSearch" placeholder="搜尋"><div class="eqList" id="eqList"></div></div></div>
<div class="sheetWrap" id="detailSheet"><div class="sheet"><div class="handle"></div><div class="sheetHead"><div class="sheetTitle" id="detailTitle">詳情</div><button class="close" data-close="detailSheet">×</button></div><div id="detail"></div></div></div>
<div class="sheetWrap" id="finishSheet"><div class="sheet"><div class="handle"></div><div class="sheetHead"><div class="sheetTitle">結束訓練</div><button class="close" data-close="finishSheet">×</button></div><div class="card signal" id="finishSummary"></div><div class="sheetActions"><button class="btn primary full" id="confirmFinish">結束</button></div></div></div>
<div class="sheetWrap" id="settingsSheet"><div class="sheet"><div class="handle"></div><div class="sheetHead"><div class="sheetTitle">AXIS</div><button class="close" data-close="settingsSheet">×</button></div><div class="detailList"><div class="detailRow"><span>版本</span><span>4.0</span></div><div class="detailRow"><span>Capture</span><span>Live Scan</span></div><div class="detailRow"><span>AI</span><span id="aiHealth">檢查中</span></div><div class="detailRow"><span>資料</span><span>本機優先</span></div></div><div class="section"><h2>資料</h2></div><button class="btn quiet full" id="exportBtn">匯出</button><button class="btn danger full" style="margin-top:8px" id="clearBtn">清除本機資料</button></div></div>
<div class="toast" id="toast"></div>
<script src="/app.js" defer></script>
</body></html>
