<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AXIS">
<link rel="manifest" href="/manifest.webmanifest">
<title>AXIS</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>AXIS</span></div>
    <button class="bareIcon" id="settingsBtn" aria-label="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.6-.6-1.4 1-1.8-2.1-2.1-1.8 1-1.4-.6L11.5 3h-3L8 5l-1.4.6-1.8-1-2.1 2.1 1 1.8-.6 1.4-2 .6v3l2 .6.6 1.4-1 1.8 2.1 2.1 1.8-1 1.4.6.6 2h3l.6-2 1.4-.6 1.8 1 2.1-2.1-1-1.8.6-1.4z"/></svg></button>
  </header>
  <main>
    <section class="view active" id="todayView">
      <div class="pageHead"><h1>今天</h1><span id="todayDate"></span></div>
      <div id="idleHome">
        <div class="sessionHero"><div><strong>尚未开始</strong><span id="lastSession">—</span></div><button class="startBtn" id="startBtn"><i></i>开始训练</button></div>
        <div class="twoStats"><div class="metric"><b id="weekMins">0</b><span>7天分钟</span></div><div class="metric"><b id="weekSessions">0</b><span>7天次数</span></div></div>
        <div id="idleSignalWrap" class="sectionBlock hidden"><div class="sectionTitle">最近</div><div class="signal" id="idleSignal"></div></div>
      </div>
      <div id="activeHome" class="hidden">
        <div class="liveTop"><div><span class="liveTag"><i></i>进行中</span><b class="timer" id="liveTimer">00:00</b></div><button class="holdFinish" id="finishHold" aria-label="长按结束训练"><span>结束</span><i></i></button></div>
        <div class="twoStats compact"><div class="metric"><b id="liveItems">0</b><span>已记录</span></div><div class="metric"><b id="liveSets">0</b><span>总组数</span></div></div>
        <div id="liveSignalWrap" class="sectionBlock hidden"><div class="sectionLine"><div class="sectionTitle">现在</div><span id="pace">正常</span></div><div class="signal" id="liveSignal"></div></div>
        <div class="sectionBlock"><div class="sectionLine"><div class="sectionTitle">时间线</div><span id="eventCount">0</span></div><div class="events" id="eventList"></div></div>
      </div>
    </section>
    <section class="view" id="historyView"><div class="pageHead"><h1>记录</h1><span id="historyCount">0</span></div><div class="events" id="historyList"></div></section>
    <section class="view" id="insightsView"><div class="pageHead"><h1>趋势</h1></div><div class="twoStats"><div class="metric"><b id="insightMins">0</b><span>7天分钟</span></div><div class="metric"><b id="insightSessions">0</b><span>30天次数</span></div></div><div class="sectionBlock"><div class="sectionTitle">30天结构</div><div class="bars" id="patternBars"></div></div><div class="sectionBlock"><div class="sectionTitle">变化</div><div class="events" id="signals"></div></div></section>
  </main>
  <div class="captureDock" id="dock"><button class="scanPrimary" id="scanBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.1"/></svg><span>扫一下</span></button></div>
  <nav class="nav"><button class="active" data-view="todayView">今天</button><button data-view="historyView">记录</button><button data-view="insightsView">趋势</button></nav>
</div>
<div class="sheetWrap" id="scanSheet"><div class="sheet"><div class="grabber"></div><div class="sheetHead"><b>扫一下</b><button class="plainClose" data-close="scanSheet" aria-label="关闭">×</button></div><div id="captureStage"><div class="camera" id="cameraBox"><video id="cameraVideo" playsinline muted></video><div class="cameraFallback hidden" id="cameraFallback">相机不可用</div><div class="scanState" id="scanState">就绪</div></div><div class="captureChoice"><button class="captureMode active" id="liveScanBtn">扫3秒</button><button class="captureMode" id="photoBtn">拍一张</button></div><input class="hiddenInput" id="photoInput" type="file" accept="image/*" capture="environment"></div><div id="reviewStage" class="hidden"><div class="film" id="film"></div><button class="resultRow" id="equipmentRow"><span>器械 / 运动</span><b id="equipmentName">待确认</b><i>›</i></button><div class="recognitionLine"><span id="aiStatus">手动确认</span><button id="voiceBtn" class="voiceBtn hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 10a6 6 0 0 0 12 0M12 16v4M9 20h6"/></svg>语音</button></div><div id="strengthFields" class="fieldGrid hidden"><div class="valueField"><span>重量</span><div class="inlineStep"><button data-step="weight" data-delta="-2.5" aria-label="减少重量">−</button><input id="weight" inputmode="decimal" value="20"><em>kg</em><button data-step="weight" data-delta="2.5" aria-label="增加重量">＋</button></div></div><div class="valueField"><span>次数</span><div class="inlineStep"><button data-step="reps" data-delta="-1">−</button><input id="reps" inputmode="numeric" value="10"><button data-step="reps" data-delta="1">＋</button></div></div><div class="valueField"><span>组数</span><div class="inlineStep"><button data-step="sets" data-delta="-1">−</button><input id="sets" inputmode="numeric" value="3"><button data-step="sets" data-delta="1">＋</button></div></div></div><div id="cardioFields" class="fieldGrid hidden"><div class="valueField"><span>分钟</span><div class="inlineStep"><button data-step="duration" data-delta="-1">−</button><input id="duration" inputmode="numeric" value="15"><button data-step="duration" data-delta="1">＋</button></div></div><div class="valueField"><span>强度</span><div class="inlineStep"><button data-step="intensity" data-delta="-1">−</button><input id="intensity" inputmode="numeric" value="5"><em>/10</em><button data-step="intensity" data-delta="1">＋</button></div></div></div><button class="saveRecord" id="saveScan">记下</button></div></div></div>
<div class="sheetWrap" id="eqSheet"><div class="sheet"><div class="grabber"></div><div class="sheetHead"><b>器械 / 运动</b><button class="plainClose" data-close="eqSheet">×</button></div><input class="search" id="eqSearch" placeholder="搜索"><div class="quickEq" id="quickEq"></div><div class="eqList" id="eqList"></div><button class="addCustom" id="addCustomEq">＋ 自定义</button></div></div>
<div class="sheetWrap" id="customEqSheet"><div class="sheet smallSheet"><div class="grabber"></div><div class="sheetHead"><b>自定义</b><button class="plainClose" data-close="customEqSheet">×</button></div><label class="textField"><span>名称</span><input id="customName" maxlength="18" placeholder="例如：蓝色腿推"></label><div class="seg" id="customType"><button class="active" data-type="strength">力量</button><button data-type="cardio">有氧</button></div><div class="seg" id="customPattern"><button class="active" data-pattern="push">推</button><button data-pattern="pull">拉</button><button data-pattern="knee">腿</button><button data-pattern="hinge">后链</button><button data-pattern="cardio">有氧</button><button data-pattern="core">核心</button></div><button class="saveRecord" id="saveCustomEq">保存</button></div></div>
<div class="sheetWrap" id="detailSheet"><div class="sheet"><div class="grabber"></div><div class="sheetHead"><b id="detailTitle">详情</b><button class="plainClose" data-close="detailSheet">×</button></div><div id="detail"></div></div></div>
<div class="sheetWrap centerWrap" id="finishSheet"><div class="finishCard"><div class="finishMark">✓</div><b id="finishDuration">0分钟</b><span>本次训练</span><div class="finishStats"><div><b id="finishItems">0</b><span>项目</span></div><div><b id="finishSets">0</b><span>组</span></div></div><button id="finishDone">完成</button></div></div>
<div class="sheetWrap" id="settingsSheet"><div class="sheet"><div class="grabber"></div><div class="sheetHead"><b>AXIS</b><button class="plainClose" data-close="settingsSheet">×</button></div><div class="settingsGroup"><div class="settingRow"><span>个人档案</span><button id="profileNameBtn">我</button></div><div class="settingRow"><span>个性器械</span><b id="memoryCount">0</b></div></div><div class="settingsGroup"><div class="settingRow"><span>保留3秒视频</span><button class="switch" id="keepClipSwitch" role="switch" aria-checked="true"><i></i></button></div><div class="settingRow"><span>保存到相册</span><button class="switch" id="albumSwitch" role="switch" aria-checked="false"><i></i></button></div></div><div class="settingsGroup"><div class="settingRow"><span>AI识别</span><b id="aiHealth">检查中</b></div><div class="settingRow"><span>版本</span><b>4.2</b></div></div><button class="settingsAction" id="exportBtn">导出记录</button><button class="settingsAction dangerText" id="clearBtn">清除本机数据</button></div></div>
<div class="toast" id="toast"></div>
<script src="/app.js" defer></script>
</body>
</html>
