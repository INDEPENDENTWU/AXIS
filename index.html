<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AXIS">
<link rel="manifest" href="./manifest.webmanifest">
<title>AXIS</title>
<style>
:root{
  --bg:#0a0b0d;--panel:#101216;--panel2:#15181d;--line:#23272e;--text:#f2f1ed;--muted:#8d939d;--dim:#626873;
  --accent:#6f78ff;--accentSoft:rgba(111,120,255,.13);--danger:#e47b74;--safe:#8eb79f;
  --r:16px;--r2:12px;--pad:20px;--max:520px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Noto Sans TC","PingFang TC",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh;overscroll-behavior:none}
button,input{font:inherit}
button{border:0;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{width:min(100%,var(--max));min-height:100dvh;margin:0 auto;position:relative;padding-bottom:104px}
.topbar{height:calc(62px + env(safe-area-inset-top));padding:calc(8px + env(safe-area-inset-top)) var(--pad) 8px;display:grid;grid-template-columns:1fr 40px;align-items:center;position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg) 78%,rgba(10,11,13,0))}
.brand{height:44px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:720;letter-spacing:.2em}
.mark{width:17px;height:17px;position:relative;transform:rotate(45deg)}
.mark::before,.mark::after{content:"";position:absolute;width:7px;height:16px;border-radius:1px;background:var(--text)}
.mark::before{left:0;top:0}.mark::after{right:0;bottom:0;background:var(--accent)}
.iconbtn{width:40px;height:40px;padding:0;display:grid;place-items:center;border:1px solid var(--line);border-radius:13px;background:transparent;color:var(--muted)}
.iconbtn svg{display:block;width:18px;height:18px}
.view{display:none;padding:0 var(--pad) 32px}.view.active{display:block}
.pagehead{display:flex;align-items:end;justify-content:space-between;margin:16px 0 14px}
.pagehead h1{margin:0;font-size:24px;line-height:1.1;font-weight:660;letter-spacing:-.035em}.date{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.session{padding:18px}.sessionTop{display:flex;align-items:center;justify-content:space-between;gap:16px}
.state{font-size:18px;font-weight:640;letter-spacing:-.02em}.sessionId{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.btn{min-height:50px;border-radius:13px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:680;transition:transform .11s ease,opacity .11s ease}
.btn:active{transform:scale(.985)}.primary{background:var(--text);color:#0a0b0d}.accent{background:var(--accent);color:white}.quiet{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.ghost{background:transparent;color:var(--muted)}.danger{background:rgba(228,123,116,.08);color:#efaaa5;border:1px solid rgba(228,123,116,.22)}.full{width:100%}
.start{margin-top:18px}.dot{width:7px;height:7px;background:var(--accent);border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{padding:13px 12px}.stat b{display:block;font-size:19px;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums}.stat span{display:block;margin-top:5px;font-size:10px;color:var(--muted)}
.section{display:flex;align-items:center;justify-content:space-between;margin:23px 0 9px}.section h2{margin:0;font-size:13px;font-weight:650}.section span{font-size:10px;color:var(--muted)}
.next{padding:15px}.nextRow{display:flex;align-items:center;justify-content:space-between;gap:12px}.nextTitle{font-size:16px;font-weight:630;letter-spacing:-.02em}.tag{font-size:9px;color:#b7bcff;background:var(--accentSoft);border:1px solid rgba(111,120,255,.24);padding:5px 7px;border-radius:999px;white-space:nowrap}.nextMeta{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}.nextActions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:13px}
.liveHead{margin:14px 0 6px;display:flex;align-items:flex-end;justify-content:space-between}.timer{font-size:34px;font-weight:620;letter-spacing:-.045em;font-variant-numeric:tabular-nums}.live{font-size:9px;color:var(--muted);letter-spacing:.12em;margin-bottom:5px}.live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px;box-shadow:0 0 0 4px var(--accentSoft)}.finish{background:transparent;color:var(--muted);font-size:12px;padding:10px 0}
.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0}.progress .stat{padding:12px 0;border-top:1px solid var(--line);border-radius:0}.progress .stat b{font-size:18px}
.coverage{padding:14px}.coverRow{display:grid;grid-template-columns:48px 1fr 18px;align-items:center;gap:10px;margin:9px 0}.coverRow span{font-size:10px;color:var(--muted)}.track{height:3px;background:#242830;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
.events{display:grid;gap:8px}.event{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:12px;padding:10px}.thumb{width:54px;height:54px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:var(--dim)}.thumb img{width:100%;height:100%;object-fit:cover}.event strong{display:block;font-size:12px;font-weight:630}.event small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.time{font-size:9px;color:var(--dim);font-variant-numeric:tabular-nums}
.empty{padding:22px 14px;border:1px dashed var(--line);border-radius:var(--r);font-size:11px;color:var(--muted);text-align:center}
.captureDock{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:82px;width:min(100%,var(--max));padding:0 var(--pad);z-index:35;pointer-events:none}.captureDock.show{display:block}.captureDock button{pointer-events:auto;box-shadow:0 16px 42px rgba(0,0,0,.42)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,var(--max));height:82px;padding:9px var(--pad) calc(10px + env(safe-area-inset-bottom));z-index:32;background:linear-gradient(180deg,rgba(10,11,13,0),var(--bg) 24%)}.navin{height:54px;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(16,18,22,.96);border:1px solid var(--line);border-radius:15px;padding:4px;backdrop-filter:blur(18px)}.nav button{background:transparent;color:var(--dim);border-radius:11px;font-size:10px;font-weight:620;display:flex;align-items:center;justify-content:center;gap:6px}.nav button.active{background:#1a1d23;color:var(--text)}.nav svg{width:15px;height:15px}
.historyItem{padding:15px;display:grid;grid-template-columns:1fr auto;gap:12px}.historyItem strong{font-size:13px}.historyItem small{display:block;font-size:10px;color:var(--muted);margin-top:5px}.score{font-size:20px;font-weight:640;text-align:right}.score span{display:block;font-size:8px;color:var(--dim);font-weight:500;margin-top:2px}
.analyticsHero{padding:17px}.big{font-size:28px;font-weight:640;letter-spacing:-.04em}.big span{font-size:11px;color:var(--muted);font-weight:500}.week{height:74px;display:grid;grid-template-columns:repeat(7,1fr);align-items:end;gap:7px;margin-top:17px}.week i{display:block;min-height:4px;background:#252930;border-radius:2px}.week i.on{background:var(--accent)}
.signals{display:grid;gap:8px}.signal{padding:12px 13px;display:grid;grid-template-columns:7px 1fr;gap:10px}.signal i{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:4px}.signal strong{font-size:11px;font-weight:630}.signal small{display:block;color:var(--muted);font-size:10px;margin-top:3px;line-height:1.4}
.sheetWrap{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(3,4,6,.68);backdrop-filter:blur(9px)}.sheetWrap.show{display:flex}.sheet{width:min(100%,var(--max));max-height:92dvh;overflow:auto;background:#0f1115;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:9px var(--pad) calc(20px + env(safe-area-inset-bottom));box-shadow:0 -28px 80px rgba(0,0,0,.5)}.handle{width:34px;height:3px;border-radius:99px;background:#373b43;margin:3px auto 18px}.sheetHead{display:grid;grid-template-columns:1fr 36px;align-items:center;gap:12px;margin-bottom:16px}.sheetTitle{font-size:17px;font-weight:650;letter-spacing:-.02em}.close{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:var(--panel2);color:var(--muted);font-size:18px}
.field{margin:16px 0}.fieldTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.fieldTop span{font-size:10px;color:var(--muted)}.fieldTop b{font-size:11px;font-weight:620}.segment{display:grid;gap:6px}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}.segment button{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--muted);font-size:11px}.segment button.active{background:var(--accentSoft);border-color:rgba(111,120,255,.45);color:var(--text)}
.sheetActions{position:sticky;bottom:-20px;display:grid;grid-template-columns:auto 1fr;gap:8px;padding:18px 0 1px;background:linear-gradient(180deg,rgba(15,17,21,0),#0f1115 26%)}.sheetActions.single{grid-template-columns:1fr}
.capture{position:relative;aspect-ratio:4/3;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#090a0c;display:grid;place-items:center}.capture input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.captureHint{font-size:11px;color:var(--muted);text-align:center}.captureHint svg{display:block;width:22px;height:22px;margin:0 auto 8px;color:var(--text)}.capture img{width:100%;height:100%;object-fit:cover}.captureCorner{position:absolute;right:10px;bottom:10px;min-height:28px;padding:0 10px;border-radius:999px;background:rgba(8,9,11,.74);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;color:#f2f1ed;font-size:9px;pointer-events:none}.photoMeta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px;font-size:9px;color:var(--dim)}.photoMeta b{font-weight:600;color:var(--muted)}
.search{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font-size:11px}.search::placeholder{color:var(--dim)}.chips{display:flex;gap:6px;overflow:auto;scrollbar-width:none;margin:8px 0}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;min-height:31px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font-size:9px}.chip.active{background:#1a1d23;color:var(--text)}.equipment{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:245px;overflow:auto}.eq{min-height:60px;text-align:left;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text)}.eq.active{background:var(--accentSoft);border-color:rgba(111,120,255,.55)}.eq strong{display:block;font-size:11px;font-weight:620}.eq small{display:block;font-size:9px;color:var(--muted);margin-top:5px}.recordGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stepbox{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.stepbox>span{display:block;font-size:9px;color:var(--muted);margin-bottom:8px}.stepper{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:6px}.stepper button{width:34px;height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:18px}.stepper b{text-align:center;font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}.rirseg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.rirseg button{height:34px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:10px}.rirseg button.active{background:var(--accentSoft);border-color:rgba(111,120,255,.5);color:var(--text)}.range{width:100%;accent-color:var(--accent)}.rangeVal{display:block;text-align:right;margin-top:6px;font-size:18px}.mini{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.detailList{border-top:1px solid var(--line);margin-top:12px}.detailRow{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:10px}.detailRow span:first-child{color:var(--muted)}.detailRow span:last-child{text-align:right;font-variant-numeric:tabular-nums}.detailPhoto{width:100%;border-radius:13px;border:1px solid var(--line);display:block}
.toast{position:fixed;left:50%;bottom:98px;z-index:130;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:var(--text);color:#0a0b0d;border-radius:9px;padding:9px 12px;font-size:10px;font-weight:650;transition:.18s ease;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
@media(min-width:700px){body{background:#050608}.app{border-left:1px solid #15181d;border-right:1px solid #15181d}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true"></span>AXIS</div>
    <button class="iconbtn" id="settingsBtn" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.6-.6-1.4 1-1.8-2.1-2.1-1.8 1-1.4-.6L11.5 3h-3L8 5l-1.4.6-1.8-1-2.1 2.1 1 1.8-.6 1.4-2 .6v3l2 .6.6 1.4-1 1.8 2.1 2.1 1.8-1 1.4.6.6 2h3l.6-2 1.4-.6 1.8 1 2.1-2.1-1-1.8.6-1.4z"/></svg></button>
  </header>

  <main>
    <section class="view active" id="todayView">
      <div class="pagehead"><h1>今天</h1><div class="date" id="todayDate"></div></div>
      <div id="idleHome">
        <div class="card session">
          <div class="sessionTop"><div><div class="state">尚未開始</div><div class="sessionId" id="lastSession">—</div></div></div>
          <button class="btn primary full start" id="startBtn"><span class="dot"></span>開始訓練</button>
        </div>
        <div class="stats">
          <div class="card stat"><b id="weekMins">0</b><span>7D 分鐘</span></div>
          <div class="card stat"><b id="weekSessions">0</b><span>7D 次數</span></div>
          <div class="card stat"><b id="balance">—</b><span>平衡</span></div>
        </div>
        <div id="idleNextWrap" class="hidden"><div class="section"><h2>下一步</h2></div><div class="card next" id="idleNext"></div></div>
      </div>

      <div id="activeHome" class="hidden">
        <div class="liveHead"><div><div class="live"><i></i>LIVE</div><div class="timer" id="liveTimer">00:00</div></div><button class="finish" id="finishBtn">結束</button></div>
        <div class="progress"><div class="stat"><b id="liveItems">0</b><span>項目</span></div><div class="stat"><b id="liveSets">0</b><span>組數</span></div><div class="stat"><b id="liveScore">0</b><span>完整度</span></div></div>
        <div class="section"><h2>下一步</h2><span id="pace">正常</span></div><div class="card next" id="liveNext"></div>
        <div class="section"><h2>結構</h2></div><div class="card coverage" id="liveCoverage"></div>
        <div class="section"><h2>時間線</h2><span id="eventCount">0</span></div><div class="events" id="eventList"></div>
      </div>
    </section>

    <section class="view" id="historyView">
      <div class="pagehead"><h1>紀錄</h1><div class="date" id="historyCount">0</div></div>
      <div class="events" id="historyList"></div>
    </section>

    <section class="view" id="analyticsView">
      <div class="pagehead"><h1>趨勢</h1></div>
      <div class="card analyticsHero"><div class="big"><b id="analyticsMins">0</b> <span>分鐘 / 7D</span></div><div class="week" id="weekBars"></div></div>
      <div class="section"><h2>30D 結構</h2></div><div class="card coverage" id="analyticsCoverage"></div>
      <div class="section"><h2>訊號</h2></div><div class="signals" id="signals"></div>
    </section>
  </main>

  <div class="captureDock" id="captureDock"><button class="btn accent full" id="captureBtn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.2"/></svg>拍照記錄</button></div>
  <nav class="nav"><div class="navin">
    <button class="active" data-view="todayView"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 11.5 12 5l8 6.5V20H4z"/></svg>今日</button>
    <button data-view="historyView"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>紀錄</button>
    <button data-view="analyticsView"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 19V9M12 19V5M19 19v-7"/></svg>趨勢</button>
  </div></nav>
</div>

<div class="sheetWrap" id="startSheet"><div class="sheet"><div class="handle"></div><div class="sheetHead"><div class="sheetTitle">開始</div><button class="close" data-close="startSheet">×</button></div>
  <div class="field"><div class="fieldTop"><span>場景</span><b id="modeLabel">健身房</b></div><div class="segment c3" data-group="mode"><button class="active" data-value="gym">健身房</button><button data-value="outdoor">戶外</button><button data-value="home">其他</button></div></div>
  <div class="field"><div class="fieldTop"><span>狀態</span><b id="energyLabel">普通</b></div><div class="segment c5" data-group="energy"><button data-value="1">1</button><button data-value="2">2</button><button class="active" data-value="3">3</button><button data-value="4">4</button><button data-value="5">5</button></div></div>
  <div class="field"><div class="fieldTop"><span>時間</span><b id="targetLabel">45 分鐘</b></div><div class="segment c4" data-group="target"><button data-value="30">30</button><button class="active" data-value="45">45</button><button data-value="60">60</button><button data-value="90">90</button></div></div>
  <div class="sheetActions single"><button class="btn primary full" id="confirmStart">開始</button></div>
</div></div>

<div class="sheetWrap" id="recordSheet"><div class="sheet"><div class="handle"></div><div class="sheetHead"><div class="sheetTitle">記錄</div><button class="close" data-close="recordSheet">×</button></div>
  <div class="capture" id="captureBox"><div class="captureHint" id="captureHint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.2"/></svg>拍攝</div><input id="photoInput" type="file" accept="image/*" capture="environment"></div>
  <div class="photoMeta"><b id="photoStatus">未拍攝</b><span>AXIS LIVE</span></div>
  <div class="field"><div class="fieldTop"><span>器械 / 活動</span><b id="eqLabel">未選</b></div><input class="search" id="eqSearch" type="search" placeholder="搜尋"><div class="chips" id="filters"><button class="chip active" data-filter="all">全部</button><button class="chip" data-filter="upper">上肢</button><button class="chip" data-filter="lower">下肢</button><button class="chip" data-filter="cardio">有氧</button><button class="chip" data-filter="free">自由</button></div><div class="equipment" id="eqGrid"></div></div>
  <div class="field hidden" id="strengthFields"><div class="recordGrid">
    <div class="stepbox"><span>重量 kg</span><div class="stepper"><button data-step="weight" data-delta="-2.5">−</button><b id="weightView">20</b><button data-step="weight" data-delta="2.5">＋</button></div><input id="weight" type="hidden" value="20"></div>
    <div class="stepbox"><span>次數</span><div class="stepper"><button data-step="reps" data-delta="-1">−</button><b id="repsView">10</b><button data-step="reps" data-delta="1">＋</button></div><input id="reps" type="hidden" value="10"></div>
    <div class="stepbox"><span>組數</span><div class="stepper"><button data-step="sets" data-delta="-1">−</button><b id="setsView">3</b><button data-step="sets" data-delta="1">＋</button></div><input id="sets" type="hidden" value="3"></div>
    <div class="stepbox"><span>餘力</span><div class="rirseg" id="rirSeg"><button data-rir="0">0</button><button data-rir="1">1</button><button class="active" data-rir="2">2</button><button data-rir="3">3</button><button data-rir="4">4</button><button data-rir="5">5</button></div><input id="rir" type="hidden" value="2"></div>
  </div></div>
  <div class="field hidden" id="cardioFields"><div class="recordGrid">
    <div class="stepbox"><span>分鐘</span><div class="stepper"><button data-step="duration" data-delta="-5">−</button><b id="durationView">15</b><button data-step="duration" data-delta="5">＋</button></div><input id="duration" type="hidden" value="15"></div>
    <div class="stepbox"><span>強度</span><input id="intensity" class="range" type="range" min="1" max="10" step="1" value="5"><b class="rangeVal" id="intensityView">5</b></div>

function getPhoto(k){return openDb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('photos','readonly'),q=tx.objectStore('photos').get(k);q.onsuccess=function(){db.close();res(q.result||null)};q.onerror=function(){db.close();rej(q.error)}})})}
async function photoUrl(k){try{var b=await getPhoto(k);return b?URL.createObjectURL(b):null}catch(e){return null}}
async function hydratePhotos(){var boxes=$$('[data-photo]');for(var i=0;i<boxes.length;i++){var b=boxes[i];if(b.dataset.loaded)continue;b.dataset.loaded='1';var u=await photoUrl(b.dataset.photo);if(u)b.innerHTML='<img src="'+u+'" alt="照片">'}}
function clearPhotos(){return new Promise(function(res){var q=indexedDB.deleteDatabase(DB);q.onsuccess=q.onerror=q.onblocked=function(){res()}})}
function bind(){
  $('#startBtn').addEventListener('click',function(){openSheet('startSheet')});$('#settingsBtn').addEventListener('click',function(){openSheet('settingsSheet')});$('#captureBtn').addEventListener('click',function(){openRecord()});$('#finishBtn').addEventListener('click',openFinish);$('#confirmFinish').addEventListener('click',finish);
  $$('[data-close]').forEach(function(b){b.addEventListener('click',function(){closeSheet(b.dataset.close)})});$$('.sheetWrap').forEach(function(w){w.addEventListener('click',function(e){if(e.target===w)closeSheet(w.id)})});
  $$('.segment').forEach(function(seg){seg.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;$$('button',seg).forEach(function(x){x.classList.remove('active')});b.classList.add('active');var g=seg.dataset.group,v=b.dataset.value;if(g==='mode')setText('#modeLabel',{gym:'健身房',outdoor:'戶外',home:'其他'}[v]);if(g==='energy')setText('#energyLabel',['','很低','偏低','普通','不錯','很好'][Number(v)]);if(g==='target')setText('#targetLabel',v+' 分鐘')})});
  $('#confirmStart').addEventListener('click',function(){function val(g){var b=$('.segment[data-group="'+g+'"] button.active');return b?b.dataset.value:null}state.active={id:uid('S'),start:Date.now(),mode:val('mode')||'gym',energy:Number(val('energy')||3),target:Number(val('target')||45),events:[]};safeSave();closeSheet('startSheet');render();toast('已開始')});
  $('#eqSearch').addEventListener('input',function(e){state.search=e.target.value;renderEq()});$('#filters').addEventListener('click',function(e){var b=e.target.closest('[data-filter]');if(!b)return;state.filter=b.dataset.filter;$$('#filters .chip').forEach(function(x){x.classList.toggle('active',x===b)});renderEq()});
  $('#saveRecord').addEventListener('click',function(){saveRecord(true)});$('#withoutPhoto').addEventListener('click',function(){saveRecord(false)});bindPhoto();
  D.addEventListener('click',function(e){var b=e.target.closest('[data-step]');if(b){var id=b.dataset.step,i=$('#'+id);if(!i)return;var min=id==='weight'?0:1,max=id==='weight'?1000:(id==='duration'?300:(id==='reps'?100:20)),n=Number(i.value)||0;n=Math.max(min,Math.min(max,n+Number(b.dataset.delta||0)));i.value=(id==='weight'?Math.round(n*10)/10:Math.round(n));syncViews();return}var r=e.target.closest('[data-rir]');if(r){$('#rir').value=r.dataset.rir;syncViews()}});$('#intensity').addEventListener('input',syncViews);
  $$('.nav button').forEach(function(b){b.addEventListener('click',function(){$$('.nav button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');$$('.view').forEach(function(v){v.classList.remove('active')});$('#'+b.dataset.view).classList.add('active');render()})});
  $('#exportBtn').addEventListener('click',function(){var blob=new Blob([JSON.stringify({version:VERSION,exportedAt:new Date().toISOString(),sessions:state.sessions,active:state.active},null,2)],{type:'application/json'}),a=D.createElement('a');a.href=URL.createObjectURL(blob);a.download='AXIS-'+dlabel(Date.now())+'.json';D.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},500);toast('已匯出')});
  $('#clearBtn').addEventListener('click',async function(){if(!window.confirm('清除本機 AXIS 資料？'))return;try{localStorage.removeItem(KEY)}catch(e){}await clearPhotos();state={sessions:[],active:null,eq:null,photo:null,filter:'all',search:''};closeSheet('settingsSheet');render();toast('已清除')});
  D.addEventListener('visibilitychange',function(){if(!D.hidden)render()});window.addEventListener('pageshow',render);
}
safeLoad();bind();render();
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
})();
</script>
</body>
